<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stillhalter Journal v6.3</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1119;--bg2:#141927;--card:#1b2133;--elev:#232a3d;--brd:rgba(255,255,255,.06);--brd2:rgba(255,255,255,.12);--t1:#eef1f5;--t2:#8d9aad;--t3:#687990;--acc:#20b2aa;--accg:rgba(32,178,170,.15);--grn:#84cc16;--red:#f43f5e;--amb:#f59e0b;--vio:#8b5cf6;--r:10px;--rs:6px;--tr:.18s cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',monospace}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);transition:border-color var(--tr)}.card:hover{border-color:var(--brd2)}
.inp{font-family:'IBM Plex Mono',monospace;font-size:.78rem;background:var(--bg);border:1px solid var(--brd);border-radius:var(--rs);padding:7px 11px;color:var(--t1);width:100%;outline:none;transition:border-color var(--tr),box-shadow var(--tr)}.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accg)}.inp::placeholder{color:var(--t3)}
.lbl{display:block;font-size:.65rem;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 16px;border-radius:var(--rs);font-size:.8rem;font-weight:600;border:none;cursor:pointer;transition:all var(--tr);outline:none;font-family:inherit}
.btn-p{background:var(--acc);color:#0e1119}.btn-p:hover{background:#36d2cf;transform:translateY(-1px);box-shadow:0 4px 14px var(--accg)}
.btn-g{background:transparent;color:var(--t2);border:1px solid var(--brd)}.btn-g:hover{background:var(--elev);color:var(--t1);border-color:var(--brd2)}
.btn-d{background:rgba(244,63,94,.1);color:var(--red)}.btn-d:hover{background:rgba(244,63,94,.2)}
.btn-s{padding:3px 9px;font-size:.7rem}
.badge{display:inline-flex;align-items:center;font-size:.58rem;font-weight:600;padding:2px 7px;border-radius:100px;text-transform:uppercase;letter-spacing:.05em}
.nav-t{padding:9px 15px;font-size:.8rem;font-weight:500;color:var(--t3);border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all var(--tr);white-space:nowrap;background:none}
.nav-t:hover{color:var(--t2)}.nav-t.on{color:var(--acc);border-bottom-color:var(--acc)}
.dtb{width:100%;border-collapse:collapse;font-size:.78rem}
.dtb thead th{font-size:.62rem;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;padding:9px 7px;border-bottom:1px solid var(--brd);text-align:left;user-select:none}
.dtb thead th.srt{cursor:pointer}.dtb thead th.srt:hover{color:var(--acc)}
.dtb tbody tr{border-bottom:1px solid var(--brd);transition:background var(--tr);cursor:pointer}.dtb tbody tr:hover{background:rgba(255,255,255,.02)}
.dtb tbody td{padding:9px 7px;vertical-align:middle}
.s-cc{border-left:3px solid var(--grn)}.s-csp{border-left:3px solid var(--acc)}.s-vs{border-left:3px solid var(--vio)}.s-ic{border-left:3px solid var(--amb)}
.rg{height:6px;border-radius:3px;background:rgba(255,255,255,.05);overflow:hidden}.rg-f{height:100%;border-radius:3px;transition:width .5s ease}
.db{height:3px;border-radius:2px;background:rgba(255,255,255,.05);overflow:hidden}.db-f{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--grn),var(--amb),var(--red));transition:width .3s}
.pb{height:5px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}.pb-f{height:100%;border-radius:3px;transition:width .5s}
.mo{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s}
.mo.on{opacity:1;pointer-events:auto}
.mp{background:var(--card);border:1px solid var(--brd2);border-radius:14px;padding:22px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;transform:translateY(8px) scale(.98);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.mo.on .mp{transform:translateY(0) scale(1)}
.toast-c{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:var(--rs);font-size:.76rem;font-weight:500;animation:ti .3s ease,to .3s ease 2.7s forwards;box-shadow:0 8px 24px rgba(0,0,0,.3)}
@keyframes ti{from{transform:translateX(30px);opacity:0}}@keyframes to{to{transform:translateX(30px);opacity:0}}
.t-ok{background:var(--grn);color:#0e1119}.t-err{background:var(--red);color:#fff}.t-info{background:var(--acc);color:#0e1119}
.fu{animation:fu .3s cubic-bezier(.4,0,.2,1)}@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.empty{text-align:center;padding:44px 20px;color:var(--t3)}.empty h3{font-size:1rem;font-weight:600;color:var(--t2);margin-bottom:6px}.empty p{font-size:.82rem;max-width:360px;margin:0 auto 14px;line-height:1.5}
@media(max-width:768px){.hm{display:none!important}.dtb{font-size:.7rem}.dtb td,.dtb th{padding:7px 4px}.nav-t{padding:7px 9px;font-size:.73rem}}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.012;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
</style>
</head>
<body>
<div id="app">
<header style="background:var(--bg2);border-bottom:1px solid var(--brd);position:sticky;top:0;z-index:50;backdrop-filter:blur(12px)">
  <div style="max-width:1480px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--vio));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.88rem">Θ</div>
      <div><div style="font-size:.92rem;font-weight:700;line-height:1.2">Stillhalter Journal</div><div class="mono" style="font-size:.57rem;color:var(--t3)">v6.3 · IB/CapTrader · Risk Engine</div><!-- v6.1: Woher der sichtbare Datenstand stammt. Bei zwei Rechnern am geteilten Ordner die wichtigste Angabe. --><span id="sync-badge" class="mono" title="Datenstand wird geprüft …" style="display:inline-block;margin-top:3px;padding:1px 8px;border-radius:9999px;font-size:.56rem;font-weight:700;background:rgba(255,255,255,.06);color:var(--t3)">Datenstand …</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:5px">
      <button class="btn btn-g btn-s" onclick="openSettings()">⚙</button>
      <button class="btn btn-g btn-s" onclick="exportCSV()">CSV</button>
      <button class="btn btn-g btn-s" onclick="exportJSON()">💾</button>
      <button class="btn btn-g btn-s" onclick="loadFromServer()" title="daten/stillhalter_journal.json vom lokalen Server (Port 8765) zurücklesen — Desaster-Recovery / PC-Umzug">⬇</button>
      <label class="btn btn-g btn-s" style="cursor:pointer">📂<input type="file" accept=".json" onchange="importJSON(event)" style="display:none"></label>
    </div>
  </div>
  <nav style="max-width:1480px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto" id="nav"></nav>
</header>
<main style="max-width:1480px;margin:0 auto;padding:18px 20px" id="main"></main>
<div class="toast-c" id="toasts"></div>
</div>

<!-- MODAL: Trade Detail -->
<div class="mo" id="M-det" onclick="if(event.target===this)cm('M-det')"><div class="mp" style="max-width:540px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <h3 id="det-title" style="font-size:1rem;font-weight:700"></h3>
    <button onclick="cm('M-det')" style="color:var(--t3);background:none;border:none;cursor:pointer;font-size:1.1rem">✕</button>
  </div>
  <div id="det-body"></div>
  <div style="display:flex;gap:6px;margin-top:14px;padding-top:10px;border-top:1px solid var(--brd)">
    <button id="det-edit" class="btn btn-g btn-s">✎ Bearbeiten</button>
    <button id="det-close" class="btn btn-s" style="background:rgba(32,178,170,.12);color:var(--acc)">✓ Schließen</button>
    <button id="det-adj" class="btn btn-s" style="background:rgba(139,92,246,.12);color:var(--vio)">⚡ Adjustment</button>
    <button id="det-dup" class="btn btn-g btn-s">⧉ Duplizieren</button>
  </div>
</div></div>

<!-- MODAL: Close -->
<div class="mo" id="M-cl" onclick="if(event.target===this)cm('M-cl')"><div class="mp">
  <h3 style="font-size:1rem;font-weight:700;margin-bottom:14px">Trade schließen</h3>
  <input type="hidden" id="cl-id">
  <div style="display:grid;gap:10px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div><label class="lbl">Close-Datum</label><input type="date" id="cl-dt" class="inp"></div>
      <div><label class="lbl">Close-Typ</label><select id="cl-tp" class="inp" onchange="clTypeChg()"><option value="BTC">Buy to Close</option><option value="EXPIRED">Expired</option><option value="ASSIGNED">Assigned</option><option value="ROLLED">Roll → neu</option></select></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div><label class="lbl">Close-Preis ($/K)</label><input type="number" id="cl-px" step="0.01" value="0" class="inp" oninput="clPrev()"></div>
      <div><label class="lbl">Kommission ($)</label><input type="number" id="cl-cm" step="0.01" value="0" class="inp" oninput="clPrev()"></div>
    </div>
    <div style="margin-top:8px"><label class="lbl">EUR/USD-Kurs beim Close (exakte EUR-Umrechnung im Cockpit)</label><input type="number" id="cl-fx" step="0.0001" class="inp" placeholder="z.B. 1.0850"></div>
    <div id="cl-af" style="display:none">
      <div><label class="lbl">Assignment-Preis</label><input type="number" id="cl-ap" step="0.01" class="inp"></div>
      <div><label class="lbl">Shares</label><input type="number" id="cl-sh" value="100" class="inp"></div>
    </div>
    <div><label class="lbl">Notiz</label><textarea id="cl-nt" rows="2" class="inp" style="resize:none"></textarea></div>
    <div style="background:var(--elev);border-radius:var(--rs);padding:10px;text-align:center">
      <div style="font-size:.58rem;color:var(--t3);text-transform:uppercase;margin-bottom:3px">P&L Vorschau</div>
      <div id="cl-pv" class="mono" style="font-size:1.3rem;font-weight:700">$0</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-p" onclick="execClose()">Bestätigen</button><button class="btn btn-g" onclick="cm('M-cl')">Abbrechen</button></div>
</div></div>

<!-- MODAL: Adjustment -->
<div class="mo" id="M-adj" onclick="if(event.target===this)cm('M-adj')"><div class="mp">
  <h3 style="font-size:1rem;font-weight:700;margin-bottom:14px">Adjustment</h3>
  <input type="hidden" id="adj-id">
  <div style="display:grid;gap:10px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div><label class="lbl">Datum</label><input type="date" id="adj-dt" class="inp"></div>
      <div><label class="lbl">Typ</label><select id="adj-tp" class="inp"><option value="ROLL_UP">Roll Up</option><option value="ROLL_DOWN">Roll Down</option><option value="ROLL_OUT">Roll Out</option><option value="ADD_LEG">Leg hin</option><option value="CLOSE_LEG">Leg zu</option><option value="OTHER">Sonstiges</option></select></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div><label class="lbl">Kosten/Credit ($)</label><input type="number" id="adj-co" step="0.01" value="0" class="inp"></div>
      <div><label class="lbl">Neuer Strike</label><input type="number" id="adj-st" step="0.5" class="inp"></div>
    </div>
    <div><label class="lbl">Notiz</label><textarea id="adj-nt" rows="2" class="inp" style="resize:none"></textarea></div>
  </div>
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-p" style="background:var(--vio)" onclick="saveAdj()">Speichern</button><button class="btn btn-g" onclick="cm('M-adj')">Abbrechen</button></div>
</div></div>

<!-- MODAL: Settings -->
<div class="mo" id="M-set" onclick="if(event.target===this)cm('M-set')"><div class="mp">
  <h3 style="font-size:1rem;font-weight:700;margin-bottom:14px">Einstellungen</h3>
  <div style="display:grid;gap:10px">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <div><label class="lbl">Kontogröße (€) *</label><input type="number" id="s-ac" step="100" placeholder="50000" class="inp"></div>
      <div><label class="lbl">Monatl. Ziel (€)</label><input type="number" id="s-tg" step="100" placeholder="2000" class="inp"></div>
      <div><label class="lbl">EUR/USD Kurs</label><input type="number" id="s-fx" step="0.0001" placeholder="1.0850" class="inp"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px">
      <div><label class="lbl">DTE Warn (Tage)</label><input type="number" id="s-dw" value="7" class="inp"></div>
      <div><label class="lbl">Max Risk/Trade %</label><input type="number" id="s-mr" value="5" step="0.5" min="0" max="100" class="inp"></div>
      <div><label class="lbl">Max Risk/Konto %</label><input type="number" id="s-ma" value="25" step="1" min="0" max="100" class="inp"></div>
    </div>
    <div><label class="lbl">Gemini API Key</label><input type="password" id="s-gm" placeholder="AIza…" class="inp"></div>
    <div><label class="lbl">KI-Modell</label><select id="s-gmm" class="inp"><option value="gemini-2.5-flash">Gemini 2.5 Flash (empfohlen)</option><option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite (günstig)</option><option value="gemini-2.5-pro">Gemini 2.5 Pro (stark)</option><option value="gemini-3.5-flash">Gemini 3.5 Flash (neueste)</option></select></div>
  </div>
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-p" onclick="saveSet()">Speichern</button><button class="btn btn-g" onclick="cm('M-set')">Abbrechen</button></div>
  <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--brd);display:flex;justify-content:space-between">
    <button class="btn btn-d btn-s" onclick="resetStillhalter()" title="Löscht nur die Browserdaten des Stillhalter-Journals — nicht die der anderen Werkzeuge und nicht die Datei auf dem Laufwerk">⚠ Reset</button>
    <span class="mono" style="font-size:.55rem;color:var(--t3)" id="s-cnt"></span>
  </div>
</div></div>

<script>
// ═══════════════════════════════════════════════════════
// DATA LAYER
// ═══════════════════════════════════════════════════════
const TK='soj4_t',SK='soj4_s',GK='soj4_g',MUL=100; // Hinweis (SH7): 100 gilt für US- und Eurex-Aktienoptionen. DAX-Optionen (ODAX, Multiplikator 5) werden nicht gehandelt und würden falsch gerechnet.
// ── v6.2 (EUR/USD-NOTWERT SICHTBAR GEMACHT) ─────────────────────────────────
// Bisher steckte 1,085 an fünf Stellen als stiller Standard — Stand vom Bauzeitpunkt.
// Fehlte der Kurs in den Settings, wurde damit gerechnet, ohne dass man es sah.
// Jetzt: EIN benannter Notwert, Settings speichern "leer" wirklich als leer, und
// das Dashboard zeigt einen Hinweis, solange mit dem Notwert gerechnet wird.
const FX_NOTWERT=1.085;
const fxFehlt=()=>{const e=ls().eurusd;return !(isFinite(e)&&e>0);};
const $=id=>document.getElementById(id);
let _corruptWarned=false;
// v4.3 FIX (Datenverlust-Pfad): korrupter Key wurde still zu [] — das naechste sv() haette die
// Originaldaten endgueltig ueberschrieben. Jetzt: Rohdaten-Rettungskopie + einmalige deutliche Warnung.
const ld=()=>{const raw=localStorage.getItem(TK);if(raw===null)return[];
  try{return JSON.parse(raw)||[]}
  catch(e){try{localStorage.setItem(TK+'__corrupt_'+Date.now(),raw)}catch(e2){}
    if(!_corruptWarned){_corruptWarned=true;
      try{alert('⚠ Trade-Daten defekt! Rohdaten wurden als Rettungskopie gesichert ('+TK+'__corrupt_…).\nNICHTS speichern — zuerst Backup importieren oder ⬇ Vom Laufwerk laden.')}catch(e3){}}
    return[]}};
const SYNC_TS='soj4_syncts';
const localTs=()=>{const v=parseInt(localStorage.getItem(SYNC_TS),10);return isFinite(v)?v:0;};
const setLocalTs=t=>{try{localStorage.setItem(SYNC_TS,String(t||Date.now()))}catch(e){}};

const sv=t=>{try{localStorage.setItem(TK,JSON.stringify(t))}catch(e){alert('\u26a0 Speicher voll! Bitte altes Backup exportieren und Daten bereinigen.\n\n'+e.message)}
  // ── v6.1: CLOUD-BETRIEB ───────────────────────────────────────────────────
  // Vorher wurde blind auf den Server geschrieben. Bei zwei Rechnern am selben
  // Cloud-Ordner haette der zweite die Arbeit des ersten kommentarlos ueberschrieben.
  // Neu: erst pruefen, ob die Datei inzwischen von woanders geaendert wurde.
  // Der Zeitstempel wird lokal gemerkt und ergibt beim naechsten Start den Vergleich.
  (async()=>{
    const jetzt=Date.now();
    try{
      const p=await fetch('http://localhost:8765/data/load?name=stillhalter_journal',{cache:'no-store'});
      if(p.ok){
        const fremd=await p.json();
        const fernTs=(fremd&&typeof fremd.ts==='number')?fremd.ts:0;
        if(fernTs>localTs()+1000){
          const wann=new Date(fernTs).toLocaleString('de-DE');
          if(!confirm('ACHTUNG \u2014 Fremder Stand auf dem Laufwerk\n\n'
            +'Die Datei wurde am '+wann+' von einem anderen Rechner geaendert ('
            +((fremd.trades||[]).length)+' Positionen dort, '+t.length+' hier).\n\n'
            +'Wenn du jetzt speicherst, werden die dortigen Aenderungen ueberschrieben.\n\n'
            +'Trotzdem speichern?')){
            toast('Nicht aufs Laufwerk geschrieben \u2014 fremder Stand ist neuer','t-err');
            return;
          }
        }
      }
    }catch(e){ /* Server aus -> nur lokal, wie bisher */ }
    try{
      const r=await fetch('http://localhost:8765/data/save?name=stillhalter_journal',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({trades:t,settings:(()=>{try{return JSON.parse(localStorage.getItem(SK))}catch(e){return null}})(),ts:jetzt})});
      if(r&&r.ok){ setLocalTs(jetzt); syncBadge('gespeichert',jetzt); }
    }catch(e){}
  })();
};

// v6.1: Beim Start das Laufwerk fragen. Der neuere Stand gewinnt.
async function syncFromDrive(){
  let d=null;
  try{ const r=await fetch('http://localhost:8765/data/load?name=stillhalter_journal',{cache:'no-store'});
       if(r.ok) d=await r.json(); }catch(e){}
  if(!d||!Array.isArray(d.trades)){ syncBadge('nur lokal',null); return false; }
  const fern=(typeof d.ts==='number')?d.ts:0, lokal=localTs();
  if(fern>lokal){
    try{ localStorage.setItem(TK,JSON.stringify(d.trades));
         if(d.settings) localStorage.setItem(SK,JSON.stringify(d.settings)); }catch(e){}
    setLocalTs(fern); syncBadge('vom Laufwerk',fern); return true;
  }
  syncBadge(lokal>fern?'lokal neuer':'synchron',lokal||fern);
  return false;
}

function syncBadge(zustand,ts){
  const el=document.getElementById('sync-badge'); if(!el) return;
  const zeit=ts?new Date(ts).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
  const warn=(zustand==='lokal neuer'||zustand==='nur lokal');
  el.textContent=zustand+(zeit?' \u00b7 '+zeit:'');
  el.style.background=warn?'rgba(245,158,11,.15)':'rgba(63,185,106,.15)';
  el.style.color='var('+(warn?'--amb':'--grn')+')';
  el.title=zustand==='lokal neuer'
    ? 'Dieser Browser hat einen neueren Stand als die Datei auf dem Laufwerk. Meist hat die Cloud noch nicht fertig synchronisiert.'
    : (zustand==='nur lokal' ? 'Kein Laufwerk-Stand gefunden. Laeuft der Server?' : 'Browser und Laufwerk stimmen ueberein.');
}

// ═══ RISK ENGINE ═══
function calcRisk(t){
  if(t.maxRisk) return t.maxRisk;
  const {strategy:s,legs:l,contracts:c,premium:p}=t;
  if(!l||!l.length||!c||!p) return null;
  const strikes=l.map(x=>x.strike).filter(Boolean);
  if(s==='CSP'){const ss=l.find(x=>x.side==='SELL')?.strike;if(!ss)return null;const r=(ss*MUL*c)-(p*MUL*c);return r>0?r:null;}
  if(s==='CC') return null;
  if(s==='BPS'||s==='BCS'){if(strikes.length>=2){const w=Math.abs(strikes[0]-strikes[1]);if(w<=0)return null;const r=(w*MUL*c)-(p*MUL*c);return r>0?r:null;}return null;}
  if(s==='IC'){
    const pS=l.filter(x=>x.type==='PUT').map(x=>x.strike).filter(Boolean);
    const cS=l.filter(x=>x.type==='CALL').map(x=>x.strike).filter(Boolean);
    const pw=pS.length>=2?Math.abs(pS[0]-pS[1]):0;
    const cw=cS.length>=2?Math.abs(cS[0]-cS[1]):0;
    const maxW=Math.max(pw,cw);if(maxW<=0)return null;
    const r=(maxW*MUL*c)-(p*MUL*c);return r>0?r:null;
  }
  if(s==='STRANGLE') return null;
  return null;
}

// ── v6.1.1 FIX (WÄHRUNGSVERMISCHUNG IN DER RISIKO-ENGINE) ───────────────────
// calcRisk() liefert das Nominalrisiko in der Währung des Basiswerts — bei
// US-Optionen also in Dollar. Die Kontogröße ist ausdrücklich in Euro erfasst
// ("Kontogröße (€)"). Beides wurde bisher ungerechnet verrechnet:
// Auslastungsprozente kamen rund 8,5 % zu HOCH heraus, das freie Budget
// entsprechend zu niedrig — und bei posSize() wurde ein Euro-Budget durch ein
// Dollar-Risiko geteilt, was zu wenige Kontrakte ergab.
// Neu: calcRiskEUR() rechnet über die vorhandene toEUR()-Funktion um, inklusive
// des am Trade gespeicherten fxClose, falls vorhanden.
// v6.3 (SH5): Short Strangle/Straddle ohne eingetragenes Max-Risk haben nach oben unbegrenztes
// Risiko. Sie zählen weiter mit 0 in der Summe, werden aber überall ausdrücklich als „unbegrenzt“ gezeigt.
const risikoUnbegrenzt=t=>(t.strategy==='STRANGLE'||t.strategy==='STRADDLE')&&!(+t.maxRisk>0);
function calcRiskEUR(t){ const r=calcRisk(t); return r==null?null:toEUR(r,t.currency||'USD',t.fxClose); }

function tradeRiskPct(t){const a=ls().accountSize;const r=calcRiskEUR(t);if(!a||!r)return null;return(r/a)*100;}
function isOverTrade(t){const p=tradeRiskPct(t);return p!==null&&p>(ls().maxTR||5);}
function totalRisk(){return ld().filter(t=>t.status==='OPEN').reduce((s,t)=>s+(calcRiskEUR(t)||0),0);} // v6.1.1: liefert jetzt EUR
function portRiskPct(){const a=ls().accountSize;return a?(totalRisk()/a*100):null;}
function isOverAcct(){const p=portRiskPct();return p!==null&&p>(ls().maxAR||25);}
function totalDelta(){return ld().filter(t=>t.status==='OPEN').reduce((s,t)=>s+((t.delta||0)*t.contracts*MUL),0);}
function availBudget(){const s=ls();if(!s.accountSize)return null;return Math.max(0,s.accountSize*(s.maxAR||25)/100-totalRisk());}
function returnOnRisk(t){if(t.pnl===null||t.pnl===undefined||!t.entryDate||!t.closeDate)return null;const r=calcRisk(t);if(!r||r<=0)return null;const d=Math.max(1,(new Date(t.closeDate)-new Date(t.entryDate))/864e5);return(t.pnl/r)*(365/d)*100;}
// v6.1.1: Der Rechner arbeitet mit Dollar-Strikes, das Budget steht in Euro.
// rpc bleibt in Dollar (so wird es angezeigt), für die Kontraktzahl wird umgerechnet.
function posSize(w,p){const s=ls();if(!s.accountSize)return{rpc:0,rpcEur:0,mc:0,pr:0};
  const rpc=(w-p)*MUL; const rpcEur=toEUR(rpc,'USD');
  const mx=s.accountSize*(s.maxTR||5)/100;
  return{rpc,rpcEur,mc:rpcEur>0?Math.floor(mx/rpcEur):0,pr:rpc>0?(p*MUL/rpc*100):0};}

// ═══ FORMATTING ═══
// v6.0 FIX: DTE zaehlte bis zum Zeitpunkt 16:00 des Verfallstags und rundete auf.
// Dadurch sprang der Wert JEDEN TAG um 16:00 Uhr um eins und lag den ganzen
// Handelstag ueber einen Tag zu hoch: am 31.07. wurden bis zum 21.08. 22 statt 21
// Tage angezeigt, und am Verfallstag selbst stand morgens noch "1 DTE" statt "0".
// Bei DTE-gesteuerter Verwaltung (21-DTE-Regel) verschiebt das jede Entscheidung
// um einen Tag. Neu: Differenz in KALENDERTAGEN, wie der Broker sie ausweist.
function dte(exp){
  if(!exp) return null;
  const e=new Date(exp+'T00:00:00'); if(isNaN(e)) return null;
  const n=new Date(); const heute=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  return Math.round((e-heute)/864e5);
}

function decayPct(en,ex){if(!en||!ex)return 0;const t=Math.max(1,(new Date(ex)-new Date(en))/864e5);return Math.min(100,Math.max(0,((new Date()-new Date(en))/864e5/t)*100));}

// v6.0: Verwaiste Rolls finden — Status ROLLED, aber kein Nachfolger vorhanden.
// Passiert, wenn nach dem Schliessen das Formular fuer die neue Position abgebrochen
// oder der Browser geschlossen wird: Die Position gilt im Journal als erledigt,
// steht beim Broker aber weiter offen. Genau die Luecke, die im Risiko-Dashboard
// zu wenig Exposure ausweist.
function orphanRolls(){
  const T=ld();
  return T.filter(t=>t.status==='ROLLED' && !t.rolledTo && !T.some(x=>x.rolledFrom===t.id));
}

function getRollChain(id){const T=ld(),chain=[],seen=new Set();let cur=T.find(t=>t.id===id);let guard=50;while(cur?.rolledFrom&&guard-->0){if(seen.has(cur.rolledFrom))break;seen.add(cur.rolledFrom);const p=T.find(t=>t.id===cur.rolledFrom);if(p)chain.unshift(p);cur=p;}cur=T.find(t=>t.id===id);if(cur)chain.push(cur);seen.clear();seen.add(id);let nxt=T.find(t=>t.rolledFrom===id);guard=50;while(nxt&&guard-->0){if(seen.has(nxt.id))break;seen.add(nxt.id);chain.push(nxt);nxt=T.find(t=>t.rolledFrom===nxt.id);}return chain;}
function delAdj(tid,idx){const T=ld();const t=T.find(x=>x.id===tid);if(!t||!t.adjustments)return;t.adjustments.splice(idx,1);sv(T);cm('M-det');toast('Adjustment gelöscht');openDetail(tid);}

let dashPeriod='all',dashWfCount=30;
// ═══ v6.0: SELBSTKONTROLLE (OPTIONSBEZUG) ═══════════════════════════════════
// Prueft, ob die gespeicherten Optionsdaten in sich stimmig sind. Aendert nichts.
// Der wichtigste Test rechnet den gespeicherten P&L aus Praemie, Rueckkauf,
// Gebuehren und Adjustments nach — exakt nach der Formel aus execClose().
// Schweregrade: 'hoch' = Zahlen falsch oder Position fehlt im Risiko
//               'mittel' = Auswertung verzerrt
//               'hinweis' = pruefenswert, meist Absicht
function optIntegrityChecks(){
  const T=ld(), F=[];
  const add=(stufe,titel,text)=>F.push({stufe,titel,text});
  if(!T.length) return F;
  const lbl=t=>`${t.underlying||'?'} ${t.strategy||''}`.trim();
  const heute=new Date(); heute.setHours(0,0,0,0);

  // ── 1. P&L aus den Rohdaten nachrechnen ───────────────────────────────────
  const abw=[];
  T.filter(t=>t.status&&t.status!=='OPEN'&&typeof t.pnl==='number').forEach(t=>{
    const n=+t.contracts, pm=+t.premium;
    if(!isFinite(n)||!isFinite(pm)||n<=0) return;
    const adj=(t.adjustments||[]).reduce((s,a)=>s+(+a.cost||0),0);
    const tp=pm*n*MUL, tc=(+t.closePrice||0)*n*MUL;
    const cc=+t.closeCommission||0, cm=+t.commission||0;
    // EXPIRED zieht bewusst KEINEN Rueckkauf und keine Schliessungsgebuehr ab.
    const soll = (t.status==='EXPIRED') ? (tp-cm+adj) : (tp-tc-cm-cc+adj);
    const d=t.pnl-soll;
    if(Math.abs(d) > Math.max(0.01, Math.abs(soll)*0.005)) abw.push({t,d});
  });
  if(abw.length){
    const s=abw.reduce((a,x)=>a+x.d,0);
    add('hoch','Gespeicherter P&L passt nicht zur Nachrechnung',
      `${abw.length} geschlossene Positionen. Aus Prämie, Rückkaufkurs, Gebühren und Adjustments ergibt sich ein anderer Wert als gespeichert. `
      +`Summe der Abweichungen: ${f$(Math.round(s))}. Prüfen: `
      +abw.slice(0,6).map(x=>lbl(x.t)+' ('+f$(Math.round(x.d))+')').join(', ')+(abw.length>6?' …':''));
  }

  // ── 2. EXPIRED mit Rueckkaufkurs ──────────────────────────────────────────
  const expPx=T.filter(t=>t.status==='EXPIRED' && +t.closePrice>0);
  if(expPx.length) add('mittel','Wertlos verfallen, aber mit Rückkaufkurs',
    `${expPx.length} Positionen stehen auf EXPIRED und haben trotzdem einen Schlusskurs. Bei wertlosem Verfall gibt es keinen Rückkauf. `
    +`Betroffen: ${expPx.slice(0,6).map(lbl).join(', ')}`);

  // ── 3. Assignment ohne erfasste Aktien ────────────────────────────────────
  const asgLeer=T.filter(t=>t.status==='ASSIGNED' && (!(+t.assignmentShares>0) || !(+t.assignmentPrice>0)));
  if(asgLeer.length) add('hoch','Eingebucht, aber Aktien nicht erfasst',
    `${asgLeer.length} Positionen sind als ASSIGNED gebucht, ohne Stückzahl oder Einbuchungskurs. Ohne diese Werte fehlt die Kostenbasis für den Wheel-Zyklus und die Aktienposition taucht nirgends auf. `
    +`Betroffen: ${asgLeer.slice(0,6).map(lbl).join(', ')}`);

  // ── 4. Stueckzahl passt nicht zu den Kontrakten ───────────────────────────
  const asgMis=T.filter(t=>t.status==='ASSIGNED' && +t.assignmentShares>0 && +t.contracts>0
    && +t.assignmentShares !== +t.contracts*MUL);
  if(asgMis.length) add('mittel','Eingebuchte Stückzahl passt nicht zu den Kontrakten',
    `${asgMis.length} Positionen. Bei ${MUL} Aktien je Kontrakt sollte die Stückzahl der Kontraktzahl mal ${MUL} entsprechen. Teilzuweisungen sind möglich — dann ist das in Ordnung. `
    +`Betroffen: ${asgMis.slice(0,6).map(t=>lbl(t)+' ('+t.assignmentShares+' bei '+t.contracts+' Kontrakten)').join(', ')}`);

  // ── 5. Assignment bei barabgerechnetem Basiswert ──────────────────────────
  const asgCash=T.filter(t=>t.status==='ASSIGNED' && isCashSettled(t.underlying));
  if(asgCash.length) add('hoch','Aktien-Assignment bei barabgerechnetem Index',
    `${asgCash.length} Positionen. ${asgCash.map(t=>t.underlying).join(', ')} wird bar abgerechnet — ein Aktien-Assignment gibt es dort nicht. `
    +`Solche Altbuchungen sollten als Buy to Close mit dem Settlement-Wert nacherfasst werden.`);

  // ── 6. Roll ohne Nachfolger ───────────────────────────────────────────────
  const orph=orphanRolls();
  if(orph.length) add('hoch','Roll ohne Anschlussposition',
    `${orph.length} Positionen sind als gerollt gebucht, aber die Anschlussposition wurde nie erfasst. Läuft sie beim Broker noch, fehlt sie hier im offenen Risiko — das Dashboard weist dann zu wenig Exposure aus. `
    +`Betroffen: ${orph.slice(0,6).map(t=>lbl(t)+' vom '+(t.closeDate||'?')).join(', ')}`);

  // ── 7. Offen, aber Verfall liegt in der Vergangenheit ─────────────────────
  const abgelaufen=T.filter(t=>t.status==='OPEN' && t.expiry && new Date(t.expiry+'T00:00:00') < heute);
  if(abgelaufen.length) add('hoch','Offene Position mit abgelaufenem Verfall',
    `${abgelaufen.length} Positionen gelten als offen, ihr Verfallsdatum liegt aber in der Vergangenheit. Sie blähen das offene Risiko auf und verfälschen Delta und Auslastung. `
    +`Betroffen: ${abgelaufen.slice(0,6).map(t=>lbl(t)+' ('+t.expiry+', '+dte(t.expiry)+' Tage)').join(', ')}`);

  // ── 8. Legs ohne Strike ───────────────────────────────────────────────────
  const ohneStrike=T.filter(t=>t.status==='OPEN' && t.strategy!=='STOCK'
    && (t.legs||[]).some(l=>!(+l.strike>0)));
  if(ohneStrike.length) add('hoch','Offene Position mit Leg ohne Strike',
    `${ohneStrike.length} Positionen. Ohne Strike lässt sich das Risiko nicht berechnen — sie fehlen in der Summe des gebundenen Kapitals. `
    +`Betroffen: ${ohneStrike.slice(0,6).map(lbl).join(', ')}`);

  // ── 9. Risiko nicht berechenbar ───────────────────────────────────────────
  // v6.3 FIX (SH5): Covered Calls (durch Aktien gedeckt) und Aktienbestand sind kein Fehler —
  // vorher stand die Warnung dauerhaft da und verdeckte echte Befunde. Strangles bekommen eine eigene Meldung.
  const risikoLos=T.filter(t=>t.status==='OPEN' && !['CC','STOCK'].includes(t.strategy) && !risikoUnbegrenzt(t) && !(calcRisk(t)>0));
  const unbegr=T.filter(t=>t.status==='OPEN' && risikoUnbegrenzt(t));
  if(unbegr.length) add('hinweis','Offene Position mit unbegrenztem Risiko',
    `${unbegr.length} Short Strangle/Straddle. Das Risiko nach oben ist unbegrenzt und steckt NICHT in der Summe des Kontorisikos. `
    +`Wer eine eigene Obergrenze ansetzt (z. B. Stopp), trägt sie im Feld „Max Risk“ ein. Betroffen: ${unbegr.slice(0,6).map(lbl).join(', ')}`);
  if(risikoLos.length) add('mittel','Offene Position ohne berechenbares Risiko',
    `${risikoLos.length} Positionen liefern kein Risiko. Die Auslastung gegen die Kontogröße wird dadurch zu niedrig ausgewiesen. `
    +`Betroffen: ${risikoLos.slice(0,6).map(lbl).join(', ')}`);

  // ── 10. Negative oder fehlende Praemie bei Credit-Strategien ──────────────
  const creditStrat=new Set(['CSP','CC','IC','BPS','BCS','STRANGLE','STRADDLE']);
  const pmBad=T.filter(t=>creditStrat.has(t.strategy) && !(+t.premium>0));
  if(pmBad.length) add('mittel','Stillhalter-Position ohne Prämie',
    `${pmBad.length} Positionen einer Prämienstrategie haben keine oder eine negative Prämie. Verzerrt jede Prämien-Kennzahl. `
    +`Betroffen: ${pmBad.slice(0,6).map(lbl).join(', ')}`);

  // ── 11. Zeitliche Unmoeglichkeiten ────────────────────────────────────────
  const zeitBad=T.filter(t=>t.entryDate && t.closeDate && new Date(t.closeDate) < new Date(t.entryDate));
  if(zeitBad.length) add('hoch','Schlussdatum liegt vor der Eröffnung',
    `${zeitBad.length} Positionen. Verzerrt Haltedauer und jede zeitbezogene Auswertung. `
    +`Betroffen: ${zeitBad.slice(0,6).map(lbl).join(', ')}`);
  const expBad=T.filter(t=>t.entryDate && t.expiry && new Date(t.expiry) < new Date(t.entryDate));
  if(expBad.length) add('hoch','Verfall liegt vor der Eröffnung',
    `${expBad.length} Positionen. Meist ein Tippfehler im Jahr. Betroffen: ${expBad.slice(0,6).map(lbl).join(', ')}`);

  // ── 12. Doppelte Kennungen ────────────────────────────────────────────────
  const seen={}, dup=[];
  T.forEach(t=>{ if(seen[t.id]) dup.push(t); else seen[t.id]=1; });
  if(dup.length) add('hoch','Doppelte Positions-IDs',
    `${dup.length} Datensätze teilen sich eine ID. Bearbeiten, Schließen und Löschen treffen dann die falsche Position.`);

  // ── 13. Geschlossen ohne Datum ────────────────────────────────────────────
  const ohneDatum=T.filter(t=>t.status&&t.status!=='OPEN'&&!t.closeDate);
  if(ohneDatum.length) add('mittel','Geschlossene Position ohne Schlussdatum',
    `${ohneDatum.length} Positionen. Sie fehlen in Monats- und Jahresauswertungen und im Steuerjahr-Filter des Cockpits. `
    +`Betroffen: ${ohneDatum.slice(0,6).map(lbl).join(', ')}`);

  return F;
}

  const hoch=F.filter(f=>f.stufe==='hoch').length, mit=F.filter(f=>f.stufe==='mittel').length;

function rDash(){
  const T=ld(),S=ls(),O=T.filter(t=>t.status==='OPEN'),allC=T.filter(t=>t.status!=='OPEN');
  if(!T.length) return`<div class="empty fu"><div style="font-size:2.5rem;opacity:.5;margin-bottom:12px">Θ</div><h3>Willkommen im Stillhalter Journal</h3><p>Erfasse deinen ersten Options-Trade. Vergiss nicht, deine Kontogröße in den Settings zu hinterlegen.</p><div style="display:flex;gap:8px;justify-content:center"><button class="btn btn-p" onclick="go('new')">+ Ersten Trade</button><button class="btn btn-g" onclick="openSettings()">⚙ Settings</button></div></div>`;

  // Period filter
  const now=new Date();let periodStart=null,periodLabel='Gesamt';
  if(dashPeriod==='week'){periodStart=new Date(now);periodStart.setDate(now.getDate()-7);periodLabel='Letzte 7 Tage';}
  else if(dashPeriod==='month'){periodStart=new Date(now.getFullYear(),now.getMonth(),1);periodLabel=now.toISOString().substring(0,7);}
  else if(dashPeriod==='quarter'){const qm=Math.floor(now.getMonth()/3)*3;periodStart=new Date(now.getFullYear(),qm,1);periodLabel='Q'+Math.ceil((now.getMonth()+1)/3)+' '+now.getFullYear();}
  else if(dashPeriod==='year'){periodStart=new Date(now.getFullYear(),0,1);periodLabel=''+now.getFullYear();}

  const inPeriod=t=>!periodStart||new Date(t.closeDate||t.entryDate)>=periodStart;
  const C=allC.filter(inPeriod);
  const Tp=T.filter(inPeriod);

  const tp=Tp.reduce((s,t)=>s+t.premium*t.contracts*MUL,0);
  const tpnl=C.reduce((s,t)=>s+(t.pnl||0),0);
  // EUR total: convert each trade's P&L and premiums to EUR
  const fx=S.eurusd||FX_NOTWERT;
  const tpnlEUR=C.reduce((s,t)=>s+toEUR(t.pnl||0,t.currency||'USD',t.fxClose),0);
  const tpEUR=Tp.reduce((s,t)=>s+toEUR(t.premium*t.contracts*MUL,t.currency||'USD',t.fxClose),0);
  const wins=C.filter(t=>(t.pnl||0)>0),losses=C.filter(t=>(t.pnl||0)<0);
  const wr=C.length?wins.length/C.length*100:0;
  const aw=wins.length?wins.reduce((s,t)=>s+t.pnl,0)/wins.length:0;
  const al=losses.length?losses.reduce((s,t)=>s+t.pnl,0)/losses.length:0;
  // ── v6.2 FIX (PROFIT FACTOR WAR DIE PAYOFF-RATIO) ─────────────────────
  // Vorher: Ø Gewinn / Ø Verlust. Das ist die Payoff-Ratio. Der Profit Factor ist
  // Σ Gewinne / Σ Verluste. Beim Stillhalten (hohe Trefferquote, kleine Gewinne)
  // klaffen beide weit auseinander: 80 % Treffer, Ø +100 / Ø −200 → Payoff 0,50
  // (rot), echter Profit Factor 2,0 (grün). Die Kennzahl stand bei einem gesunden
  // Konto systematisch auf Rot. Payoff-Ratio bleibt als Zusatz in der Unterzeile.
  const sumW=wins.reduce((s,t)=>s+t.pnl,0), sumL=Math.abs(losses.reduce((s,t)=>s+t.pnl,0));
  const pf=sumL>0?sumW/sumL:(sumW>0?Infinity:0);
  const payoff=Math.abs(al)>0?aw/Math.abs(al):0;
  const op=O.reduce((s,t)=>s+t.premium*t.contracts*MUL,0);
  const oR=totalRisk(),rP=portRiskPct();
  const totalCommAll=Tp.reduce((s,t)=>s+(t.commission||0)+(t.closeCommission||0),0);

  let h='<div class="fu">';
  // Period selector
  const pBtns=[['all','Alle'],['week','Woche'],['month','Monat'],['quarter','Quartal'],['year','Jahr']];
  h+=`<div style="display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap;align-items:center"><span style="font-size:.68rem;color:var(--t3);margin-right:4px">Zeitraum:</span>${pBtns.map(([k,l])=>`<button class="btn btn-s ${dashPeriod===k?'btn-p':'btn-g'}" onclick="dashPeriod='${k}';render()" style="padding:4px 10px">${l}</button>`).join('')}<span class="mono" style="font-size:.68rem;color:var(--t2);margin-left:8px">${periodLabel} · ${C.length} Trades</span></div>`;

  // Monthly target
  const tm=new Date().toISOString().substring(0,7);
  const mp=T.filter(t=>t.entryDate.startsWith(tm)).reduce((s,t)=>s+toEUR(t.premium*t.contracts*MUL,t.currency||'USD',t.fxClose),0); // v6.3 FIX (SH6): Ziel ist in €, also Prämien in € umrechnen
  if(S.monthlyTarget){const pc=Math.min(100,mp/S.monthlyTarget*100);
    h+=`<div class="card" style="padding:12px;margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><span style="font-size:.76rem;color:var(--t2)">Prämien-Ziel ${tm}</span><span class="mono" style="font-size:.76rem;${pc>=100?'color:var(--grn)':'color:var(--acc)'}">${fE(Math.round(mp))} / ${fE(S.monthlyTarget)} (${pc.toFixed(0)}%)</span></div><div class="pb"><div class="pb-f" style="width:${pc}%;background:${pc>=100?'var(--grn)':'var(--acc)'}"></div></div></div>`;}

  if(fxFehlt()) h+=`<div style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:var(--r);padding:10px 12px;margin-bottom:14px;font-size:.76rem;color:var(--amb)">⚠ Kein EUR/USD-Kurs in den Settings — Euro-Werte (Risiko, Budget, P&amp;L in €) werden mit dem Notwert ${FX_NOTWERT} gerechnet. <a href="#" onclick="openSettings();return false" style="color:var(--amb);font-weight:700">Kurs eintragen</a></div>`;
  // Risk alert
  if(isOverAcct()) h+=`<div style="background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.25);border-radius:var(--r);padding:12px;margin-bottom:14px;display:flex;align-items:center;gap:10px"><span style="font-size:1.5rem">🚨</span><div><div style="font-size:.86rem;font-weight:700;color:var(--red)">Konto-Risiko überschritten</div><div style="font-size:.76rem;color:var(--red);opacity:.8">Offenes Risiko ${fE(Math.round(oR))} = ${fp(rP)} (Max: ${S.maxAR||25}%)</div></div></div>`;

  // KPIs
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:18px">`;
  h+=kpi('Offene Trades',O.length,'','--acc')+kpi('Offene Prämie',f$(Math.round(op)),'unrealisiert','--acc');
  h+=kpi('Gesamtprämie',fE(Math.round(tpEUR)),periodLabel,'--vio')+kpi('Realisiert P&L',fE(Math.round(tpnlEUR)),C.length+' Trades',tpnlEUR>=0?'--grn':'--red');
  h+=kpi('Win Rate',fp(wr),wins.length+'/'+C.length,wr>=60?'--grn':wr>=40?'--amb':'--red');
  h+=kpi('Avg Win/Loss',f$(Math.round(aw))+' / '+f$(Math.round(al)),'','--grn');
  h+=kpi('Profit Factor',isFinite(pf)?pf.toFixed(2):'∞','Payoff '+payoff.toFixed(2),pf>=1.5?'--grn':pf>=1?'--amb':'--red');
  h+=kpi('Offenes Risiko',fE(Math.round(oR)),rP!==null?fp(rP)+' Konto':'Konto setzen!',rP>(S.maxAR||25)?'--red':'--grn');
  h+=kpi('Σ Gebühren',f$(Math.round(totalCommAll)),periodLabel,'--red');
  h+='</div>';

  // v6.0: Selbstkontrolle direkt unter den Kennzahlen. Sie enthaelt auch die
  // Warnung zu Rolls ohne Nachfolger, deshalb steht dafuer kein zweiter Kasten mehr.
  h+=rIntegrity();

  // Charts row 1: Prämien + Strategie
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:18px"><div class="card" style="padding:14px"><div style="font-size:.8rem;font-weight:600;margin-bottom:8px">Prämien-Entwicklung</div><div style="position:relative;height:190px"><canvas id="ch-pr"></canvas></div></div><div class="card" style="padding:14px"><div style="font-size:.8rem;font-weight:600;margin-bottom:8px">P&L nach Strategie</div><div style="position:relative;height:190px"><canvas id="ch-st"></canvas></div></div></div>`;

  // NEW: P&L per trade bar chart with zero line
  h+=`<div class="card" style="padding:14px;margin-bottom:18px"><div style="font-size:.8rem;font-weight:600;margin-bottom:8px">P&L pro Trade · ${periodLabel}</div><div style="position:relative;height:200px"><canvas id="ch-pnl"></canvas></div></div>`;

  // Waterfall with configurable count
  h+=`<div class="card" style="padding:14px;margin-bottom:18px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:.8rem;font-weight:600">P&L Waterfall (kumuliert)</span><div style="display:flex;align-items:center;gap:6px"><label class="lbl" style="margin:0">Trades:</label><select id="wf-cnt" onchange="dashWfCount=parseInt(this.value);render()" class="inp" style="width:70px;padding:3px 7px;font-size:.7rem">${[10,20,30,50,100,9999].map(n=>`<option value="${n}" ${dashWfCount===n?'selected':''}>${n===9999?'Alle':n}</option>`).join('')}</select></div></div><div style="position:relative;height:180px"><canvas id="ch-wf"></canvas></div></div>`;

  // Open positions
  h+=`<div class="card" style="padding:14px"><div style="font-size:.8rem;font-weight:600;margin-bottom:10px">Offene Positionen</div><div style="display:flex;flex-direction:column;gap:5px;max-height:300px;overflow-y:auto">`;
  if(!O.length) h+='<div class="empty" style="padding:20px"><p>Keine offenen Positionen</p></div>';
  else [...O].sort((a,b)=>(dte(a.expiry)||999)-(dte(b.expiry)||999)).forEach(t=>{
    const d=dte(t.expiry),m=ST[t.strategy]||{},r=calcRisk(t),rp=tradeRiskPct(t),dc=decayPct(t.entryDate,t.expiry);
    const stk=(t.legs||[]).map(l=>l.strike).filter(Boolean).join('/');
    h+=`<div class="${m.c||''}" style="display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:var(--rs);background:var(--elev);cursor:pointer;transition:background var(--tr)" onclick="openDetail('${t.id}')" onmouseover="this.style.background='rgba(255,255,255,.04)'" onmouseout="this.style.background='var(--elev)'">
      <div style="display:flex;align-items:center;gap:7px;flex:1;min-width:0">
        <span class="badge" style="${m.bg}">${t.strategy}</span>
        <span style="font-weight:600;font-size:.83rem">${escHtml(t.underlying)}</span>
        <span style="font-size:.7rem;color:var(--t3)">${stk} · ${t.contracts}x</span>
        ${r?`<span class="mono" style="font-size:.6rem;${riskC(rp)}">⚠${f$(Math.round(r))}</span>`:''}
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:48px"><div class="db"><div class="db-f" style="width:${dc}%"></div></div></div>
        <span class="mono" style="font-size:.8rem;width:40px;text-align:right;${dteS(d)}">${d!==null?d+'d':'–'}</span>
        <button class="btn btn-g btn-s" onclick="event.stopPropagation();openCl('${t.id}')" style="padding:2px 7px">✓</button>
      </div></div>`;
  });
  h+='</div></div></div>';
  return h;
}

function kpi(l,v,sub,cv){return`<div class="card" style="padding:10px"><div style="font-size:.58rem;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px">${l}</div><div class="mono" style="font-size:1rem;font-weight:700;color:var(${cv});line-height:1.2">${v}</div>${sub?`<div style="font-size:.55rem;color:var(--t3);margin-top:2px">${sub}</div>`:''}</div>`;}

// ═══ TRADE LIST ═══
function rTrades(){
  const T=ld();
  let h=`<div class="fu"><div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;align-items:center">
    <select id="fl-s" onchange="fS=this.value;render()" class="inp" style="width:auto;padding:5px 9px;font-size:.73rem"><option value="">Alle Strategien</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select>
    <select id="fl-st" onchange="fSt=this.value;render()" class="inp" style="width:auto;padding:5px 9px;font-size:.73rem"><option value="">Alle Status</option><option value="OPEN">Offen</option><option value="CLOSED">Geschlossen</option><option value="ROLLED">Gerollt</option><option value="ASSIGNED">Assigned</option><option value="EXPIRED">Expired</option></select>
    <select id="fl-u" onchange="fU=this.value;render()" class="inp" style="width:auto;padding:5px 9px;font-size:.73rem"><option value="">Alle UL</option>${[...new Set(T.map(t=>t.underlying))].sort().map(u=>`<option value="${u}">${u}</option>`).join('')}</select>
    <input type="text" id="fl-q" oninput="flq(this)" placeholder="Suche…" class="inp" style="width:130px;padding:5px 9px;font-size:.73rem">
    <span style="margin-left:auto;font-size:.68rem;color:var(--t3)" class="mono" id="tc"></span></div>
  <div style="overflow-x:auto"><table class="dtb"><thead><tr>
    <th style="width:28px"><input type="checkbox" onchange="togAll(this.checked)"></th>
    <th class="srt" onclick="srt('entryDate')">Datum</th><th class="srt" onclick="srt('underlying')">UL</th><th>Strat</th><th class="hm">Legs</th>
    <th class="srt" style="text-align:right" onclick="srt('premium')">Prämie</th><th style="text-align:right" class="hm">Max Risk</th><th style="text-align:right" class="hm">% Konto</th>
    <th class="srt" style="text-align:right" onclick="srt('pnl')">P&L</th><th class="srt hm" style="text-align:right" onclick="srt('dte')">DTE</th>
    <th style="text-align:center">Status</th><th style="text-align:center">Aktionen</th>
  </tr></thead><tbody>`;

  let f=T;
  const fs=fS,fst=fSt,fu=fU,fq=(fQ||'').toUpperCase(); // v4.2.20: aus persistenten Variablen statt DOM
  if(fs)f=f.filter(t=>t.strategy===fs);if(fst)f=f.filter(t=>t.status===fst);if(fu)f=f.filter(t=>t.underlying===fu);
  /* v4.2.21: Suche -- Guard gegen fehlendes Underlying + Gross/Klein-Normalisierung */
  if(fq)f=f.filter(t=>(t.underlying||'').toUpperCase().includes(fq)||(t.notes||'').toUpperCase().includes(fq)||(t.tags||[]).some(g=>g.toUpperCase().includes(fq)));

  f.sort((a,b)=>{let va,vb;
    if(sortF==='premium'){va=a.premium*a.contracts;vb=b.premium*b.contracts;}
    else if(sortF==='pnl'){va=a.pnl||0;vb=b.pnl||0;}
    else if(sortF==='dte'){va=dte(a.expiry)??999;vb=dte(b.expiry)??999;}
    else{va=a[sortF]||'';vb=b[sortF]||'';}
    if(typeof va==='string')return sortD==='desc'?vb.localeCompare(va):va.localeCompare(vb);
    return sortD==='desc'?vb-va:va-vb;
  });

  if(!f.length) h+='<tr><td colspan="12"><div class="empty"><h3>Keine Trades</h3><p>Ändere die Filter oder erfasse einen neuen Trade.</p><button class="btn btn-p" onclick="go(\'new\')">+ Neu</button></div></td></tr>';

  f.forEach(t=>{
    const m=ST[t.strategy]||{},d=t.strategy==='STOCK'?null:(t.status==='OPEN'?dte(t.expiry):null),tp=t.premium*t.contracts*MUL;
    const r=calcRisk(t),rp=tradeRiskPct(t),ov=isOverTrade(t);
    const ri=t.rolledFrom?'🔄':'',ai=(t.adjustments||[]).length?'⚡':'';
    const ror=returnOnRisk(t);
    const premCol=t.strategy==='STOCK'?`${t.contracts}×${f2(t.underlyingPrice||0)}`:f$(Math.round(tp));
    h+=`<tr class="${m.c||''}" onclick="openDetail('${t.id}')">
      <td onclick="event.stopPropagation()"><input type="checkbox" ${sel.has(t.id)?'checked':''} onchange="togSel('${t.id}',this.checked)"></td>
      <td class="mono" style="font-size:.7rem;color:var(--t3)">${t.entryDate}</td>
      <td style="font-weight:600">${escHtml(t.underlying)}<span style="font-size:.55rem"> ${ri}${ai}</span></td>
      <td><span class="badge" style="${m.bg||''}">${t.strategy}</span></td>
      <td class="mono hm" style="font-size:.68rem;color:var(--t3)">${strikesFmt(t.legs)}</td>
      <td class="mono" style="text-align:right">${premCol}</td>
      <td class="mono hm" style="text-align:right;${ov?'color:var(--red);font-weight:600':'color:var(--t2)'}">${r?f$(Math.round(r)):'–'}</td>
      <td class="mono hm" style="text-align:right;${riskC(rp)}">${rp!==null?fp(rp):'–'}</td>
      <td class="mono" style="text-align:right;${t.pnl!==null?pnlC(t.pnl):'color:var(--t3)'}">${t.pnl!==null?f$(Math.round(t.pnl))+(ror?` <span style="font-size:.55rem;opacity:.7">(${fp(ror)} ann.)</span>`:''):'–'}</td>
      <td class="mono hm" style="text-align:right;${d!==null?dteS(d):'color:var(--t3)'}">${d!==null?d+'d':t.status!=='OPEN'&&t.entryDate&&t.closeDate?Math.ceil((new Date(t.closeDate)-new Date(t.entryDate))/864e5)+'d <span style="font-size:.5rem;opacity:.6">gehalten</span>':'–'}</td>
      <td style="text-align:center"><span class="badge" style="${SB[t.status]||''}">${t.status}</span></td>
      <td style="text-align:center" onclick="event.stopPropagation()"><div style="display:flex;justify-content:center;gap:2px">
        ${t.status==='OPEN'?`<button class="btn btn-s" style="padding:2px 6px;background:rgba(32,178,170,.12);color:var(--acc)" onclick="openCl('${t.id}')" title="Schließen">✓</button><button class="btn btn-s" style="padding:2px 6px;background:rgba(139,92,246,.12);color:var(--vio)" onclick="openAdj('${t.id}')" title="Adj">⚡</button>`:''}
        ${t.status!=='OPEN'?`<button class="btn btn-s btn-g" style="padding:2px 6px" onclick="reopenTrade('${t.id}')" title="Öffnen">↺</button>`:''}
        <button class="btn btn-s btn-g" style="padding:2px 6px" onclick="event.stopPropagation();editTrade('${t.id}')" title="Bearbeiten">✎</button>
        <button class="btn btn-s btn-g" style="padding:2px 6px" onclick="dupTrade('${t.id}')" title="Dup">⧉</button>
        <button class="btn btn-s" style="padding:2px 6px;color:var(--red);background:rgba(244,63,94,.08)" onclick="delTrade('${t.id}')" title="Del">✕</button>
      </div></td></tr>`;
  });

  h+='</tbody></table></div></div>';
  setTimeout(()=>{const c=$('tc');if(c)c.textContent=f.length+'/'+T.length;},20);
  return h;
}

function srt(f){if(sortF===f)sortD=sortD==='desc'?'asc':'desc';else{sortF=f;sortD='desc';}render();}
function togSel(id,c){if(c)sel.add(id);else sel.delete(id);}
function togAll(c){ld().forEach(t=>{if(c)sel.add(t.id);else sel.delete(t.id)});render();}

    </div>
    ${isStock?`
    <div style="padding:10px;background:var(--elev);border-radius:var(--rs);font-size:.76rem;color:var(--t2)">📦 Aktien-Altbestand: Trage den <strong>Kaufkurs pro Share</strong> im Feld "Kaufkurs" ein. Prämien kommen später durch CC/CSP dazu.</div>

      <div><label class="lbl">Kaufkurs (/Share) *</label><input type="number" id="tf-up" required step="0.01" value="${t.underlyingPrice||''}" placeholder="165.50" class="inp"></div>
      <div><label class="lbl">Währung</label><select id="tf-cy" class="inp"><option value="USD" ${(t.currency||'USD')==='USD'?'selected':''}>USD</option><option value="EUR" ${t.currency==='EUR'?'selected':''}>EUR</option></select></div>

      <div><label class="lbl">Kommission</label><input type="number" id="tf-cm" step="0.01" value="${t.commission||0}" class="inp" oninput="calcLive()"></div>

function legR(l,i){
  return`<div style="display:grid;grid-template-columns:1fr 1fr 1.2fr 1.2fr auto;gap:5px;align-items:end;background:var(--elev);border-radius:var(--rs);padding:6px">
    <div><label class="lbl">${l.label||'Leg '+(i+1)}</label><select onchange="fLegs[${i}].side=this.value" class="inp" style="padding:4px 7px;font-size:.7rem"><option value="SELL" ${l.side==='SELL'?'selected':''}>SELL</option><option value="BUY" ${l.side==='BUY'?'selected':''}>BUY</option></select></div>
    <div><label class="lbl">Typ</label><select onchange="fLegs[${i}].type=this.value" class="inp" style="padding:4px 7px;font-size:.7rem"><option value="CALL" ${l.type==='CALL'?'selected':''}>CALL</option><option value="PUT" ${l.type==='PUT'?'selected':''}>PUT</option></select></div>
    <div><label class="lbl">Strike</label><input type="number" step="0.5" value="${l.strike||''}" onchange="fLegs[${i}].strike=parseFloat(this.value);calcLive()" class="inp" style="padding:4px 7px;font-size:.7rem" placeholder="170"></div>
    <div><label class="lbl">Leg $/K</label><input type="number" step="0.01" value="${l.legPremium||''}" onchange="fLegs[${i}].legPremium=parseFloat(this.value);autoNetPrem();calcLive()" class="inp" style="padding:4px 7px;font-size:.7rem" placeholder="opt."></div>
    <button type="button" onclick="fLegs.splice(${i},1);$('legs-c').innerHTML=fLegs.map((l,i)=>legR(l,i)).join('')" style="color:var(--red);background:none;border:none;cursor:pointer;font-size:.82rem;padding:3px">✕</button></div>`;
}
function addLeg(){fLegs.push({type:'CALL',side:'SELL',strike:null,legPremium:null,label:''});const c=$('legs-c');if(c)c.innerHTML=fLegs.map((l,i)=>legR(l,i)).join('');}
function autoNetPrem(){
  const withPrem=fLegs.filter(l=>l.legPremium!==null&&l.legPremium!==undefined);
  if(!withPrem.length)return;
  // Net = sum of SELL premiums - sum of BUY premiums
  let net=0;
  withPrem.forEach(l=>{net+=l.side==='SELL'?(l.legPremium||0):-(l.legPremium||0);});
  const el=$('tf-pm');if(el){el.value=Math.abs(net).toFixed(2);}
}
function updDTE(){const ex=$('tf-ex')?.value,dt=$('tf-dt')?.value,el=$('tf-dte');if(!el)return;if(!ex){el.textContent='–';el.style.color='var(--t3)';return;}const d=dte(ex);if(d===null){el.textContent='–';el.style.color='var(--t3)';return;}el.textContent=d+'d';el.style.cssText=`padding:7px 11px;font-size:.78rem;background:var(--bg);border:1px solid var(--brd);border-radius:var(--rs);font-weight:600;${dteS(d)}`;}
function calcLive(){
  const el=$('tf-calc');if(!el)return;
  const pm=parseFloat($('tf-pm')?.value)||0,k=parseInt($('tf-q')?.value)||1,up=parseFloat($('tf-up')?.value)||0;
  const ex=$('tf-ex')?.value,dt=$('tf-dt')?.value,ccy=$('tf-cy')?.value||'USD';
  const strike=fLegs.length?fLegs.find(l=>l.side==='SELL')?.strike||0:0;
  const fx=ls().eurusd||FX_NOTWERT;
  if(!pm&&!up&&!strike){el.style.display='none';return;}
  el.style.display='grid';el.style.gridTemplateColumns='repeat(auto-fit,minmax(160px,1fr))';el.style.gap='8px';
  let h='';
  // 1. Gesamteinnahme
  const totalPrem=pm*k*(ccy==='EUR'?100:MUL);
  const totalPremEUR=ccy==='USD'?totalPrem/fx:totalPrem;
  h+=`<div><span style="color:var(--t3);font-size:.6rem">GESAMTEINNAHME</span><div class="mono" style="color:var(--grn);font-weight:700;font-size:.88rem">${fCcy(totalPrem,ccy,2)}</div>${ccy==='USD'?`<div class="mono" style="color:var(--t3);font-size:.65rem">≈ ${fE2(totalPremEUR)}</div>`:''}</div>`;
  // 2. Abstand Strike → Kurs
  if(strike&&up){const dist=Math.abs(up-strike);const distPct=(dist/up*100);
    const distEUR=ccy==='USD'?dist/fx:dist;
    h+=`<div><span style="color:var(--t3);font-size:.6rem">ABSTAND STRIKE↔KURS</span><div class="mono" style="font-size:.88rem">${fCcy(dist,ccy,2)} (${distPct.toFixed(1)}%)</div>${ccy==='USD'?`<div class="mono" style="color:var(--t3);font-size:.65rem">≈ ${fE2(distEUR)}</div>`:''}</div>`;}
  // 3. Max Risk pro Trade
  const capital=strike?(strike*k*(ccy==='EUR'?100:MUL)):(up?up*k*(ccy==='EUR'?100:MUL):0);
  if(capital>0){const maxLoss=capital-totalPrem;
    h+=`<div><span style="color:var(--t3);font-size:.6rem">MAX RISK (TRADE)</span><div class="mono" style="color:var(--red);font-weight:700;font-size:.88rem">${fCcy(maxLoss,ccy,0)}</div><div class="mono" style="color:var(--t3);font-size:.65rem">Cash: ${fCcy(capital,ccy,0)} − Prämie</div></div>`;}
  // 4. Rendite auf Kapital
  if(capital>0){const yieldPct=(totalPrem/capital*100);
    h+=`<div><span style="color:var(--t3);font-size:.6rem">RENDITE AUF KAPITAL</span><div class="mono" style="color:var(--acc);font-weight:700;font-size:.88rem">${yieldPct.toFixed(2)}%</div><div class="mono" style="color:var(--t3);font-size:.65rem">auf ${fCcy(capital,ccy,0)}</div></div>`;}
  // 5. Rendite p.a. bezogen auf DTE
  if(capital>0&&ex&&dt){const days=Math.max(1,Math.ceil((new Date(ex)-new Date(dt))/864e5));const yieldPct=(totalPrem/capital*100);const pa=yieldPct*(365/days);
    h+=`<div><span style="color:var(--t3);font-size:.6rem">RENDITE P.A. (${days}d)</span><div class="mono" style="color:var(--vio);font-weight:700;font-size:.88rem">${pa.toFixed(1)}% p.a.</div><div class="mono" style="color:var(--t3);font-size:.65rem">${yieldPct.toFixed(2)}% in ${days} Tagen</div></div>`;}
  // 5. EUR/USD info
  if(ccy==='USD'){h+=`<div><span style="color:var(--t3);font-size:.6rem">EUR/USD KURS</span><div class="mono" style="font-size:.88rem">${fx.toFixed(4)}</div><div style="font-size:.6rem;color:var(--t3)">Ändern in ⚙ Settings</div></div>`;}
  el.innerHTML=h;
}
function applyTpl(s){if(!ST[s])return;const sel=$('tf-st');if(sel)sel.value=s;
  if(s==='STOCK'){fLegs=[];const pre={underlying:$('tf-ul')?.value||'',strategy:'STOCK',entryDate:$('tf-dt')?.value||today(),contracts:parseInt($('tf-q')?.value)||100,legs:[],premium:0,expiry:$('tf-dt')?.value||today(),underlyingPrice:$('tf-up')?.value||'',commission:parseFloat($('tf-cm')?.value)||0,tags:($('tf-tg')?.value||'').split(',').map(s=>s.trim()).filter(Boolean),notes:$('tf-nt')?.value||''};$('main').innerHTML=rForm(pre);return;}
  fLegs=ST[s].legs.map(l=>({...l,strike:null,legPremium:null}));const c=$('legs-c');if(c)c.innerHTML=fLegs.map((l,i)=>legR(l,i)).join('');}

function syncLegs(){$('legs-c')?.querySelectorAll(':scope > div').forEach((d,i)=>{if(!fLegs[i])return;const se=d.querySelectorAll('select'),inp=d.querySelectorAll('input[type="number"]');fLegs[i].side=se[0]?.value||fLegs[i].side;fLegs[i].type=se[1]?.value||fLegs[i].type;fLegs[i].strike=parseFloat(inp[0]?.value)||null;fLegs[i].legPremium=parseFloat(inp[1]?.value)||null;});}

function saveTrade(e){
  e.preventDefault();syncLegs();
  const ul=($('tf-ul')?.value||'').trim();const st=$('tf-st')?.value;const dt=$('tf-dt')?.value;const ex=$('tf-ex')?.value;const pm=$('tf-pm')?.value;
  if(!ul){toast('Underlying fehlt!','t-err');return;}if(!st){toast('Strategie wählen!','t-err');return;}
  if(!dt){toast('Entry-Datum fehlt!','t-err');return;}
  if(st==='STOCK'){
    const up=$('tf-up')?.value;
    if(!up||parseFloat(up)<=0){toast('Kaufkurs pro Share eingeben!','t-err');return;}
  } else {
    if(!ex){toast('Expiry fehlt!','t-err');return;}
    if(!pm&&pm!=='0'&&parseFloat(pm)<0){toast('Prämie ungültig!','t-err');return;}
    if(new Date(ex)<new Date(dt)){toast('Expiry muss nach Entry liegen!','t-err');return;}
    if(fLegs.length&&fLegs.some(l=>!l.strike)){toast('Bitte alle Strikes ausfüllen!','t-err');return;}
  }

  const T=ld();const id=editId||gid();
  const tags=($('tf-tg')?.value||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
  const trade={id,underlying:($('tf-ul')?.value||'').toUpperCase(),strategy:$('tf-st')?.value,entryDate:$('tf-dt')?.value,contracts:parseInt($('tf-q')?.value)||1,
    legs:JSON.parse(JSON.stringify(fLegs)),premium:parseFloat($('tf-pm')?.value)||0,expiry:$('tf-ex')?.value,underlyingPrice:parseFloat($('tf-up')?.value)||null,
    commission:parseFloat($('tf-cm')?.value)||0,currency:$('tf-cy')?.value||'USD',delta:parseFloat($('tf-de')?.value)||null,theta:parseFloat($('tf-th')?.value)||null,
    iv:parseFloat($('tf-iv')?.value)||null,ivRank:parseFloat($('tf-ir')?.value)||null,maxRisk:parseFloat($('tf-ri')?.value)||null,
    tags,notes:$('tf-nt')?.value||'',rolledFrom:(editId?null:pendingRollFrom),adjustments:[],status:'OPEN',closeDate:null,closeType:null,closePrice:null,closeCommission:0,closeNotes:'',pnl:null,assignmentPrice:null,assignmentShares:null,fxClose:null};
  const idx=T.findIndex(t=>t.id===id);
  if(idx>=0){const o=T[idx];
    // If closed trade is being edited, read close data from form (if fields exist)
    if(o.status!=='OPEN'&&$('tf-cd')){
      trade.status=o.status;
      trade.closeDate=$('tf-cd')?.value||o.closeDate;
      const _nct=$('tf-ct')?.value||o.closeType;
      if(_nct==='ASSIGNED'&&isCashSettled(trade.underlying)){toast(trade.underlying+' ist barabgerechnet — ASSIGNED nicht möglich (Cash Settlement).','t-err');return;} // v4.3.1
      trade.closeType=_nct;
      // v6.3 FIX (SH2): Status folgt dem korrigierten Close-Typ — vorher blieb der alte Status stehen.
      trade.status={BTC:'CLOSED',EXPIRED:'EXPIRED',ASSIGNED:'ASSIGNED',ROLLED:'ROLLED'}[_nct]||o.status;
      trade.closePrice=parseFloat($('tf-cp')?.value)||0;
      trade.closeCommission=parseFloat($('tf-cc')?.value)||0;
      trade.closeNotes=$('tf-cn')?.value||'';
      trade.assignmentPrice=$('tf-ap')?parseFloat($('tf-ap')?.value)||null:o.assignmentPrice;
      trade.assignmentShares=$('tf-as')?parseInt($('tf-as')?.value)||100:o.assignmentShares;
    } else {
      trade.status=o.status;trade.closeDate=o.closeDate;trade.closeType=o.closeType;
      trade.closePrice=o.closePrice;trade.closeCommission=o.closeCommission;trade.closeNotes=o.closeNotes;
      trade.assignmentPrice=o.assignmentPrice;trade.assignmentShares=o.assignmentShares;
    }
    trade.fxClose=o.fxClose||null; // v4.2.22 (Opt④): Pro-Trade-FX bei Edit erhalten
    trade.adjustments=o.adjustments||[];trade.rolledFrom=o.rolledFrom;trade.rolledTo=o.rolledTo||null; // v6.3 FIX (SH3): Vorwärtszeiger beim Bearbeiten erhalten
    // Recalculate P&L if trade is closed
    if(trade.status!=='OPEN'&&trade.closeDate){
      const adj=(trade.adjustments||[]).reduce((s,a)=>s+(a.cost||0),0);
      const tp2=trade.premium*trade.contracts*MUL,tc2=(trade.closePrice||0)*trade.contracts*MUL;
      if(trade.closeType==='EXPIRED')trade.pnl=tp2-trade.commission+adj;
      else trade.pnl=tp2-tc2-trade.commission-(trade.closeCommission||0)+adj;
    } else {trade.pnl=null;}
    T[idx]=trade;}else T.push(trade);
  // v6.0: Vorwaertszeiger auf dem Vorgaenger setzen, damit die Kette in BEIDE
  // Richtungen lesbar ist — und damit ein abgebrochener Roll erkennbar bleibt.
  if(trade.rolledFrom){
    const vor=T.find(x=>x.id===trade.rolledFrom);
    if(vor) vor.rolledTo=trade.id;
  }
  pendingRollFrom=null;
  sv(T);editId=null;toast('Trade gespeichert');
  const rp=tradeRiskPct(trade);if(rp!==null&&isOverTrade(trade))toast(`⚠ Risk ${fp(rp)} > ${ls().maxTR||5}% Limit!`,'t-err');
  go('trades');
}

// v6.2 FIX: Das Feld "Shares" im Assignment stand fest auf 100 — bei 2 Kontrakten

function openCl(id){const t=ld().find(x=>x.id===id);$('cl-id').value=id;$('cl-dt').value=today();$('cl-px').value='0';$('cl-cm').value='0';$('cl-tp').value='BTC';$('cl-nt').value='';$('cl-af').style.display='none';$('cl-fx').value=(ls().eurusd||'');if(t){$('cl-sh').value=String((+t.contracts||1)*MUL);$('cl-px').readOnly=false;}clPrev();om('M-cl');}
function clTypeChg(){
  const t=$('cl-tp').value;const af=$('cl-af');const px=$('cl-px');
  if(t==='ASSIGNED'){af.style.display='grid';af.style.gridTemplateColumns='1fr 1fr';af.style.gap='8px';}else{af.style.display='none';}
  // v6.0 FIX: Bei ASSIGNED wurde der Schlusskurs NICHT zurueckgesetzt — nur bei EXPIRED.
  // Realer Ablauf: man tippt erst einen Rueckkaufkurs fuer "Buy to Close" und stellt dann
  // fest, dass man eingebucht wurde. Beim Umschalten blieb der Kurs stehen und wurde als
  // Rueckkauf abgezogen. Im Test: statt +248,80 EUR standen -501,20 EUR im Journal —
  // 750 EUR Fehler bei EINEM Kontrakt, und die Praemie war faelschlich weg.
  // Bei einem Assignment gibt es keinen Rueckkauf: die Praemie bleibt vollstaendig,
  // das Ergebnis der Aktien steckt spaeter in deren Einstandskurs.
  if(t==='EXPIRED'||t==='ASSIGNED'){ if(px){ px.value='0'; px.readOnly=true; px.title='Bei '+t+' gibt es keinen Rückkauf — die Prämie bleibt vollständig.'; } }
  else { if(px){ px.readOnly=false; px.title=''; } }
  clPrev();
}
function clPrev(){const t=ld().find(x=>x.id===$('cl-id').value);if(!t)return;const ct=$('cl-tp').value,cp=parseFloat($('cl-px').value)||0,cc=parseFloat($('cl-cm').value)||0;const adj=(t.adjustments||[]).reduce((s,a)=>s+(a.cost||0),0);const tp=t.premium*t.contracts*MUL,tc=cp*t.contracts*MUL;let pnl=ct==='EXPIRED'?tp-t.commission+adj:tp-tc-t.commission-cc+adj;const el=$('cl-pv');el.textContent=f$(Math.round(pnl));el.style.cssText=`font-size:1.3rem;font-weight:700;${pnl>=0?'color:var(--grn)':'color:var(--red)'}`;}
function execClose(){
  const id=$('cl-id').value,T=ld(),i=T.findIndex(t=>t.id===id);if(i<0)return;const t=T[i];
  const ct=$('cl-tp').value,cp=parseFloat($('cl-px').value)||0,cc=parseFloat($('cl-cm').value)||0;
  const adj=(t.adjustments||[]).reduce((s,a)=>s+(a.cost||0),0);
  t.closeDate=$('cl-dt').value;t.closeType=ct;t.closePrice=cp;t.closeCommission=cc;t.closeNotes=$('cl-nt').value;t.fxClose=parseFloat($('cl-fx').value)||null;
  const tp=t.premium*t.contracts*MUL,tc=cp*t.contracts*MUL;
  if(ct==='EXPIRED'){t.status='EXPIRED';t.pnl=tp-t.commission+adj;}
  else if(ct==='ASSIGNED'){
    if(isCashSettled(t.underlying)){toast(t.underlying+' ist barabgerechnet (Cash Settlement) — kein Aktien-Assignment möglich. Bitte als \'Buy to Close\' mit dem Settlement-Wert buchen.','t-err');return;}
    t.status='ASSIGNED';t.assignmentPrice=parseFloat($('cl-ap').value)||null;t.assignmentShares=parseInt($('cl-sh').value)||((+t.contracts||1)*MUL);t.pnl=tp-tc-t.commission-cc+adj;}
  else if(ct==='ROLLED'){t.status='ROLLED';t.pnl=tp-tc-t.commission-cc+adj;}
  else{t.status='CLOSED';t.pnl=tp-tc-t.commission-cc+adj;}
  sv(T);cm('M-cl');toast('Geschlossen: '+f$(Math.round(t.pnl)));
  if(ct==='ROLLED'){editId=null;pendingRollFrom=t.id;const r={underlying:t.underlying,strategy:t.strategy,contracts:t.contracts,legs:(t.legs||[]).map(l=>({...l,strike:null,legPremium:null})),rolledFrom:t.id,entryDate:today()};$('main').innerHTML=rForm(r);return;}
  // CSP assigned → offer CC creation for Wheel
  if(ct==='ASSIGNED'&&t.strategy==='CSP'){
    if(confirm(`${t.underlying} eingebucht! Jetzt Covered Call schreiben für den Wheel-Zyklus?`)){
      createWheelCC(t.underlying);return;
    }
  }
  render();
}
