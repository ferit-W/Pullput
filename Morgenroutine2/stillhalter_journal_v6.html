// ═══ RISK DASHBOARD ═══
function rRisk(){
  const S=ls(),O=ld().filter(t=>t.status==='OPEN'),ac=S.accountSize||0,mT=S.maxTR||5,mA=S.maxAR||25;
  const oR=totalRisk(),oD=totalDelta(),rP=ac?(oR/ac*100):0,avail=availBudget();
  if(!ac)return`<div class="empty fu"><div style="font-size:2rem;opacity:.5;margin-bottom:10px">⚠</div><h3>Kontogröße erforderlich</h3><p>Hinterlege deine Kontogröße in den Settings.</p><button class="btn btn-p" onclick="openSettings()">⚙ Settings</button></div>`;
  const byU={};O.forEach(t=>{if(!byU[t.underlying])byU[t.underlying]={r:0,p:0,d:0,n:0,c:0,u:0};if(risikoUnbegrenzt(t))byU[t.underlying].u++;byU[t.underlying].r+=calcRiskEUR(t)||0; /* v6.3 FIX (SH4): EUR wie die Kontogröße */byU[t.underlying].p+=t.premium*t.contracts*MUL;byU[t.underlying].d+=(t.delta||0)*t.contracts*MUL;byU[t.underlying].n++;byU[t.underlying].c+=t.contracts;});

  let h=`<div class="fu"><h2 style="font-size:1.05rem;font-weight:700;margin-bottom:14px">⚠ Risiko-Management</h2>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:16px">
    <div class="card" style="padding:14px"><div class="lbl" style="margin-bottom:8px">Konto-Übersicht</div><div style="display:grid;gap:7px">
      <div style="display:flex;justify-content:space-between"><span style="font-size:.8rem;color:var(--t2)">Kontogröße</span><span class="mono" style="font-size:.8rem">${fE(ac)}</span></div>
      <div style="display:flex;justify-content:space-between"><span style="font-size:.8rem;color:var(--t2)">Offenes Risiko</span><span class="mono" style="font-size:.8rem;${rP>mA?'color:var(--red);font-weight:600':'color:var(--grn)'}">${fE(Math.round(oR))}</span></div>
      <div style="display:flex;justify-content:space-between"><span style="font-size:.8rem;color:var(--t2)">% Konto</span><span class="mono" style="font-size:.85rem;font-weight:700;${rP>mA?'color:var(--red)':'color:var(--grn)'}">${fp(rP)}</span></div>
      <div class="rg" style="margin:3px 0"><div class="rg-f" style="width:${Math.min(100,rP/mA*100)}%;background:${rP>mA?'var(--red)':rP>mA*.7?'var(--amb)':'var(--grn)'}"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:.57rem;color:var(--t3)"><span>0%</span><span style="color:var(--amb)">${mA}% Limit</span></div>
      ${O.filter(risikoUnbegrenzt).length?`<div style="display:flex;justify-content:space-between" title="Short Strangle/Straddle ohne eingetragenes Max Risk — nicht in der Summe enthalten"><span style="font-size:.8rem;color:var(--amb)">Zusätzlich unbegrenzt</span><span class="mono" style="font-size:.8rem;color:var(--amb)">${O.filter(risikoUnbegrenzt).length} Pos.</span></div>`:''}
      <div style="display:flex;justify-content:space-between;margin-top:3px"><span style="font-size:.8rem;color:var(--t2)">Verfügbar</span><span class="mono" style="font-size:.8rem;color:var(--grn)">${avail!==null?fE(Math.round(avail)):'–'}</span></div>
    </div></div>
    <div class="card" style="padding:14px"><div class="lbl" style="margin-bottom:8px">Greeks Aggregiert</div><div style="display:grid;gap:7px">
      <div style="display:flex;justify-content:space-between"><span style="font-size:.8rem;color:var(--t2)">Gesamt-Delta</span><span class="mono" style="font-size:.8rem;${oD>0?'color:var(--grn)':oD<0?'color:var(--red)':''}">${oD>0?'+':''}${oD.toFixed(0)}</span></div>
      <div style="display:flex;justify-content:space-between"><span style="font-size:.8rem;color:var(--t2)">Positionen</span><span class="mono">${O.length}</span></div>
      <div style="display:flex;justify-content:space-between"><span style="font-size:.8rem;color:var(--t2)">Kontrakte</span><span class="mono">${O.reduce((s,t)=>s+t.contracts,0)}</span></div>
      <div style="display:flex;justify-content:space-between"><span style="font-size:.8rem;color:var(--t2)">Underlyings</span><span class="mono">${Object.keys(byU).length}</span></div>
      <div style="display:flex;justify-content:space-between"><span style="font-size:.8rem;color:var(--t2)">Ø DTE</span><span class="mono">${O.length?Math.round(O.reduce((s,t)=>s+(dte(t.expiry)||0),0)/O.length):0}d</span></div>
    </div></div>
    <div class="card" style="padding:14px"><div class="lbl" style="margin-bottom:8px">Position-Sizing</div><div style="display:grid;gap:7px">
      <div><label class="lbl">Spread-Breite ($)</label><input type="number" id="ps-w" value="5" step="0.5" class="inp" style="padding:4px 7px" oninput="calcPS()"></div>
      <div><label class="lbl">Prämie/K ($)</label><input type="number" id="ps-p" value="1.00" step="0.05" class="inp" style="padding:4px 7px" oninput="calcPS()"></div>
      <div id="ps-r" class="mono" style="font-size:.73rem;display:grid;gap:3px;padding:7px;background:var(--elev);border-radius:var(--rs)"></div>
    </div></div>
  </div>`;

  // UL concentration table
  h+=`<div class="card" style="padding:14px"><div class="lbl" style="margin-bottom:10px">Risiko nach Underlying</div><table class="dtb"><thead><tr><th>UL</th><th style="text-align:right">#</th><th style="text-align:right">K</th><th style="text-align:right">Risk</th><th style="text-align:right">%</th><th style="text-align:right">Δ</th><th style="width:70px">Gauge</th></tr></thead><tbody>`;
  Object.entries(byU).sort((a,b)=>b[1].r-a[1].r).forEach(([sym,d])=>{const p=d.r/ac*100,sl=mT*2;
    h+=`<tr style="cursor:default"><td style="font-weight:600">${sym}</td><td class="mono" style="text-align:right">${d.n}</td><td class="mono" style="text-align:right">${d.c}</td><td class="mono" style="text-align:right;${p>sl?'color:var(--red);font-weight:600':''}">${fE(Math.round(d.r))}${d.u?' <span style="color:var(--amb)" title="enthält Strangle/Straddle mit unbegrenztem Risiko">+ unbegrenzt</span>':''}</td><td class="mono" style="text-align:right;${p>sl?'color:var(--red)':p>sl*.7?'color:var(--amb)':'color:var(--grn)'}">${fp(p)}</td><td class="mono" style="text-align:right;${d.d>0?'color:var(--grn)':d.d<0?'color:var(--red)':''}">${d.d>0?'+':''}${d.d.toFixed(0)}</td><td><div class="rg"><div class="rg-f" style="width:${Math.min(100,p/sl*100)}%;background:${p>sl?'var(--red)':'var(--grn)'}"></div></div></td></tr>`;
  });
  h+='</tbody></table></div></div>';
  setTimeout(calcPS,50);return h;
}

function calcPS(){const w=parseFloat($('ps-w')?.value)||5,p=parseFloat($('ps-p')?.value)||1;const r=posSize(w,p);const el=$('ps-r');if(!el)return;el.innerHTML=`<div style="display:flex;justify-content:space-between"><span style="color:var(--t2)">Risk/K:</span><span>${f$(r.rpc)} <span style="color:var(--t3);font-size:.62rem">≈ ${fE(Math.round(r.rpcEur))}</span></span></div><div style="display:flex;justify-content:space-between"><span style="color:var(--t2)">Max Kontrakte:</span><span style="color:var(--acc);font-weight:700;font-size:.85rem">${r.mc||'–'}</span></div><div style="display:flex;justify-content:space-between"><span style="color:var(--t2)">Prämie/Risk:</span><span>${r.pr.toFixed(1)}%</span></div>`;}

// ═══ WHEEL ═══
function calcWheelData(sym,tds){
  const wt=tds.filter(t=>t.strategy==='CSP'||t.strategy==='CC'||t.strategy==='STOCK').sort((a,b)=>a.entryDate.localeCompare(b.entryDate));
  if(!wt.length)return null;
  const cspTrades=wt.filter(t=>t.strategy==='CSP');
  const ccTrades=wt.filter(t=>t.strategy==='CC');
  const stockTrades=wt.filter(t=>t.strategy==='STOCK');
  const otherTrades=tds.filter(t=>t.strategy!=='CSP'&&t.strategy!=='CC'&&t.strategy!=='STOCK');
  const tpnl=wt.reduce((s,t)=>s+(t.pnl||0),0);
  const totalCSPprem=cspTrades.reduce((s,t)=>s+t.premium*t.contracts*MUL,0);
  const totalCCprem=ccTrades.reduce((s,t)=>s+t.premium*t.contracts*MUL,0);
  const totalComm=wt.reduce((s,t)=>s+(t.commission||0)+(t.closeCommission||0),0);
  let shares=0,shareSource='none',origBuyPrice=null;
  // 1. STOCK positions (Altbestand)
  const activeStock=stockTrades.filter(t=>t.status==='OPEN');
  if(activeStock.length){const s=activeStock[activeStock.length-1];shares=s.contracts;shareSource='stock';origBuyPrice=s.underlyingPrice||0;}
  // 2. CSP assignments (overrides if later)
  const asg=cspTrades.filter(t=>t.status==='ASSIGNED');
  if(asg.length){const la=asg[asg.length-1];if(la.assignmentPrice){shares=la.assignmentShares||100;shareSource='assigned';origBuyPrice=la.assignmentPrice;}}
  const hasShares=shares>0;
  let bruttoPrice=null,effektivPrice=null,premReduction=0,commEffect=0;
  if(hasShares&&origBuyPrice){
    bruttoPrice=origBuyPrice;
    // Realized gain per trade: closed → use actual P&L (includes BTC cost, commissions)
    // open → use full entry premium (not yet closed)
    // v6.1.1 FIX: Adjustments (Roll-Kosten, Nachjustierungen) blieben hier außen vor.
    // Der Kommentar behauptete sogar, der P&L berücksichtige sie — das tut er,
    // diese Funktion aber nicht. Folge: Die Prämien-Reduktion im Wheel wurde zu
    // hoch und der effektive Einstandspreis damit zu optimistisch ausgewiesen.
    // Beispiel: Prämie +100, Roll −20, Rückkauf −10 → tatsächlich 70 statt 90.
    function realizedPrem(t){
      const adj=(t.adjustments||[]).reduce((s,a)=>s+(+a.cost||0),0);
      if(t.status==='OPEN') return t.premium*t.contracts*MUL + adj;
      // For closed: P&L already accounts for close price, commissions, adjustments
      // But we want just the premium effect, not commissions (those go in commEffect)
      // So: entry premium minus close cost = net premium retained
      const ep=t.premium*t.contracts*MUL;
      const cp=(t.closePrice||0)*t.contracts*MUL;
      return ep-cp+adj;   // v6.1.1: Adjustments einbezogen
    }
    const cspPremPS=cspTrades.reduce((s,t)=>s+realizedPrem(t),0)/(shares||100);
    const shareDate=shareSource==='assigned'?(asg[asg.length-1].closeDate||asg[asg.length-1].entryDate):(activeStock.length?activeStock[activeStock.length-1].entryDate:'');
    const ccAfterPS=ccTrades.filter(t=>t.entryDate>=shareDate).reduce((s,t)=>s+realizedPrem(t),0)/(shares||100);
    premReduction=cspPremPS+ccAfterPS;
    commEffect=totalComm/(shares||100);
    effektivPrice=bruttoPrice-premReduction+commEffect;
  }
  const calledAway=ccTrades.some(t=>t.status==='ASSIGNED');
  const stockSold=stockTrades.some(t=>t.status==='CLOSED');
  const currentlyHolding=hasShares&&!calledAway&&!(shareSource==='stock'&&stockSold);
  const openCC=ccTrades.find(t=>t.status==='OPEN');
  const openCSP=cspTrades.find(t=>t.status==='OPEN');
  return{wt,tpnl,totalCSPprem,totalCCprem,totalComm,bruttoPrice,effektivPrice,premReduction,commEffect,shares,shareSource,hasShares,currentlyHolding,openCC,openCSP,cspTrades,ccTrades,stockTrades,otherTrades};
}

function rWheel(){
  const T=ld(),byU={};T.forEach(t=>{if(!byU[t.underlying])byU[t.underlying]=[];byU[t.underlying].push(t)});
  let h=`<div class="fu"><h2 style="font-size:1.05rem;font-weight:700;margin-bottom:5px">Wheel Tracker</h2>
    <p style="font-size:.8rem;color:var(--t3);margin-bottom:6px">Aktien + CSP + CC pro Underlying · Effektiver Einkaufspreis inkl. Gebühren</p>
    <div style="margin-bottom:14px"><button class="btn btn-g btn-s" onclick="addStockPosition()">+ Aktien-Altbestand einpflegen</button></div>`;
  let found=false;
  Object.entries(byU).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([sym,tds])=>{
    const wd=calcWheelData(sym,tds);if(!wd)return;found=true;
    const {wt,tpnl,totalCSPprem,totalCCprem,totalComm,bruttoPrice,effektivPrice,premReduction,commEffect,shares,shareSource,hasShares,currentlyHolding,openCC,openCSP,cspTrades,ccTrades,stockTrades,otherTrades}=wd;
    h+=`<div class="card" style="padding:14px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:1.1rem;font-weight:700">${escHtml(sym)}</span>
          <span style="font-size:.68rem;color:var(--t3)">${wt.length} Trades</span>
          ${currentlyHolding?`<span class="badge" style="background:rgba(245,158,11,.15);color:var(--amb)">${shares} SHARES · ${shareSource==='stock'?'ALTBESTAND':'ASSIGNED'}</span>`:''}
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <div style="text-align:right"><div style="font-size:.5rem;color:var(--t3);text-transform:uppercase">CSP Prämien</div><div class="mono" style="font-size:.75rem;color:var(--acc)">${f$(Math.round(totalCSPprem))}</div></div>
          <div style="text-align:right"><div style="font-size:.5rem;color:var(--t3);text-transform:uppercase">CC Prämien</div><div class="mono" style="font-size:.75rem;color:var(--grn)">${f$(Math.round(totalCCprem))}</div></div>
          <div style="text-align:right"><div style="font-size:.5rem;color:var(--t3);text-transform:uppercase">Gebühren</div><div class="mono" style="font-size:.75rem;color:var(--red)">${f$(Math.round(totalComm))}</div></div>
          <div style="text-align:right"><div style="font-size:.5rem;color:var(--t3);text-transform:uppercase">P&L</div><div class="mono" style="font-size:.75rem;${pnlC(tpnl)}">${f$(Math.round(tpnl))}</div></div>
        </div>
      </div>`;
    if(hasShares){
      const redPct=bruttoPrice>0?((premReduction/bruttoPrice)*100):0;
      const ccy=wt[0]?.currency||'USD';
      const totalValEUR=toEUR(shares*effektivPrice,ccy);
      h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px;padding:12px;background:var(--elev);border-radius:var(--rs)">
        <div><div style="font-size:.52rem;color:var(--t3);text-transform:uppercase">Einstieg (Brutto)</div><div class="mono" style="font-size:.92rem;color:var(--t1)">${f2(bruttoPrice)}<span style="font-size:.55rem;color:var(--t3)"> /Sh</span></div></div>
        <div><div style="font-size:.52rem;color:var(--t3);text-transform:uppercase">Effektiv (Prämien−Geb.)</div><div class="mono" style="font-size:.92rem;font-weight:700;color:var(--acc)">${f2(effektivPrice)}<span style="font-size:.55rem;color:var(--t3)"> /Sh</span></div></div>
        <div><div style="font-size:.52rem;color:var(--t3);text-transform:uppercase">Prämien ↓ (${redPct.toFixed(1)}%)</div><div class="mono" style="font-size:.92rem;color:var(--grn)">−${f2(premReduction)}<span style="font-size:.55rem;color:var(--t3)"> /Sh</span></div></div>
        <div><div style="font-size:.52rem;color:var(--t3);text-transform:uppercase">Gebühren ↑</div><div class="mono" style="font-size:.92rem;color:var(--red)">+${f2(commEffect)}<span style="font-size:.55rem;color:var(--t3)"> /Sh</span></div></div>
        <div><div style="font-size:.52rem;color:var(--t3);text-transform:uppercase">Gesamt</div><div class="mono" style="font-size:.92rem">${shares}× ${f2(effektivPrice)} = <span style="color:var(--acc)">${fCcy(Math.round(shares*effektivPrice),ccy,0)}</span></div>
          ${ccy==='USD'?`<div class="mono" style="font-size:.6rem;color:var(--t3)">≈ ${fE(Math.round(totalValEUR))}</div>`:''}</div>
      </div>`;
    }
    // RISK SECTION — CSP exposure, CC upside cap, total risk
    const openCSPs=cspTrades.filter(t=>t.status==='OPEN');
    const openCCs=ccTrades.filter(t=>t.status==='OPEN');
    const ccy=wt[0]?.currency||'USD';
    const mul2=ccy==='EUR'?100:MUL;
    let riskRows=[];
    // CSP Risk: Cash-secured amount per open CSP
    openCSPs.forEach(csp=>{
      const ss=csp.legs?.find(l=>l.side==='SELL')?.strike||0;
      const cashNeeded=ss*csp.contracts*mul2;
      const premReceived=csp.premium*csp.contracts*mul2;
      riskRows.push({label:`CSP ${csp.expiry?.substring(5)||''} Strike ${ss}`,cash:cashNeeded,prem:premReceived,maxLoss:cashNeeded-premReceived,type:'csp'});
    });
    // CC Risk: Upside cap
    if(currentlyHolding&&openCCs.length){
      openCCs.forEach(cc=>{
        const cs=cc.legs?.find(l=>l.side==='SELL')?.strike||0;
        // v6.1.1 FIX: Der maximale Gewinn eines Covered Calls reicht nur so weit,
        // wie der Call Aktien deckt — nicht über den gesamten Bestand.
        // Bei 300 Stück und einem einzigen Call wurde der Gewinn verdreifacht,
        // bei mehreren Calls addierte sich der Fehler je Call erneut.
        const gedeckt=Math.min(shares,(+cc.contracts||0)*MUL);
        const capGain=cs&&effektivPrice?(cs-effektivPrice)*gedeckt:0;
        const premCC=cc.premium*cc.contracts*mul2;
        riskRows.push({label:`CC ${cc.expiry?.substring(5)||''} Strike ${cs}`,capPrice:cs,capGain:capGain,prem:premCC,type:'cc'});
      });
    }
    // Share exposure
    if(currentlyHolding){
      const exposure=shares*(effektivPrice||bruttoPrice||0);
      riskRows.push({label:`Aktien ${shares}×${f2(effektivPrice||bruttoPrice||0)}`,exposure,type:'shares'});
    }
    if(riskRows.length){
      const totalExposure=riskRows.reduce((s,r)=>s+(r.cash||r.exposure||0),0);
      h+=`<div style="margin-bottom:10px;padding:10px;background:rgba(244,63,94,.04);border:1px solid rgba(244,63,94,.12);border-radius:var(--rs)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:.6rem;color:var(--t3);text-transform:uppercase;font-weight:600">⚠ Risiko · ${escHtml(sym)}</span>
          <span class="mono" style="font-size:.72rem;color:var(--red);font-weight:600">Σ ${fCcy(totalExposure,ccy,0)} Exposure</span>
        </div>`;
      riskRows.forEach(r=>{
        if(r.type==='csp'){
          h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:.68rem;border-bottom:1px solid var(--brd)">
            <span style="color:var(--t2)">${r.label}</span>
            <div class="mono" style="display:flex;gap:12px">
              <span style="color:var(--t3)">Cash: ${fCcy(r.cash,ccy,0)}</span>
              <span style="color:var(--grn)">Prämie: ${fCcy(r.prem,ccy,0)}</span>
              <span style="color:var(--red)">Max Loss: ${fCcy(r.maxLoss,ccy,0)}</span>
            </div></div>`;
        } else if(r.type==='cc'){
          h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:.68rem;border-bottom:1px solid var(--brd)">
            <span style="color:var(--t2)">${r.label}</span>
            <div class="mono" style="display:flex;gap:12px">
              <span style="color:var(--amb)">Upside gekappt bei ${fCcy(r.capPrice,ccy,2)}</span>
              <span style="color:var(--acc)">Max Gewinn: ${fCcy(r.capGain,ccy,0)}</span>
              <span style="color:var(--grn)">+Prämie: ${fCcy(r.prem,ccy,0)}</span>
            </div></div>`;
        } else if(r.type==='shares'){
          h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:.68rem">
            <span style="color:var(--t2)">${r.label}</span>
            <span class="mono" style="color:var(--amb)">Kapitalbindung: ${fCcy(r.exposure,ccy,0)}</span></div>`;
        }
      });
      h+=`</div>`;
    }
    h+='<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">';
    if(currentlyHolding&&!openCC)h+=`<button class="btn btn-p btn-s" onclick="createWheelCC('${escHtml(sym)}')" style="background:var(--grn)">+ CC schreiben</button>`;
    if(!openCSP)h+=`<button class="btn btn-p btn-s" onclick="createWheelCSP('${escHtml(sym)}')">+ CSP verkaufen</button>`;
    if(!currentlyHolding)h+=`<button class="btn btn-g btn-s" onclick="addStockPosition('${escHtml(sym)}')">+ Aktien einbuchen</button>`;
    h+='</div>';
    const sections=[{t:'Aktien',tr:stockTrades},{t:'Cash-Secured Puts',tr:cspTrades},{t:'Covered Calls',tr:ccTrades},{t:'Andere',tr:otherTrades}];
    sections.filter(s=>s.tr.length).forEach(sec=>{
      h+=`<div style="margin-bottom:6px"><div style="font-size:.55rem;color:var(--t3);text-transform:uppercase;margin-bottom:3px">${sec.t} (${sec.tr.length})</div><div style="display:flex;flex-wrap:wrap;gap:4px">`;
      sec.tr.forEach(t=>{const m=ST[t.strategy]||{},d=t.status==='OPEN'?dte(t.expiry):null;
        const info=t.strategy==='STOCK'?`${t.contracts}Sh@${f2(t.underlyingPrice||0)}`:`${f$(Math.round(t.premium*t.contracts*MUL))}`;
        const pnlBadge=t.pnl!==null&&t.status!=='OPEN'?`<span class="mono" style="font-size:.6rem;${pnlC(t.pnl)}">${f$(Math.round(t.pnl))}</span>`:'';
        h+=`<div class="${m.c||''}" style="display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:var(--rs);background:var(--bg);font-size:.65rem;cursor:pointer" onclick="openDetail('${t.id}')">
          <span class="badge" style="${m.bg}">${t.strategy}</span><span style="color:var(--t2)">${t.entryDate.substring(5)}</span>

}

// v4.3: Gegenstueck zum Auto-Backup in sv() — Server-Stand per Klick zuruecklesen.
async function loadFromServer(){
  if(!confirm('Daten vom Laufwerk (Server) laden? Aktuelle Browser-Daten werden überschrieben!'))return;
  try{
    const r=await fetch('http://localhost:8765/data/load?name=stillhalter_journal',{cache:'no-store'});
    if(!r.ok){toast(r.status===404?'Noch keine Server-Daten (erst einmal speichern).':'Server-Fehler: HTTP '+r.status,'t-err');return;}
    const d=await r.json();
    if(!d||!Array.isArray(d.trades)){toast('Ungültige Server-Daten','t-err');return;}
    localStorage.setItem(TK,JSON.stringify(d.trades));
    if(d.settings)localStorage.setItem(SK,JSON.stringify(d.settings));
    toast('Vom Laufwerk geladen ('+d.trades.length+' Trades)');
    setTimeout(()=>location.reload(),600);
  }catch(e){toast('Server nicht erreichbar — läuft die START-Batchdatei?','t-err');}
}
function exportJSON(){const d={version:'6.0',date:new Date().toISOString(),trades:ld(),settings:ls()};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`stillhalter-v6-${today()}.json`;a.click();URL.revokeObjectURL(u);toast('Backup exportiert');}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!d.trades?.length){alert('Ungültig');return;}if(!confirm(d.trades.length+' Trades importieren?'))return;d.trades.forEach(t=>{if(!t.adjustments)t.adjustments=[];if(!t.tags)t.tags=[];if(t.ivr!==undefined&&t.ivRank===undefined)t.ivRank=t.ivr;if(t.legs)t.legs.forEach(l=>{if(l.t&&!l.type){l.type=l.t;l.side=l.s;l.label=l.l;delete l.t;delete l.s;delete l.l}})});sv(d.trades);if(d.settings)localStorage.setItem(SK,JSON.stringify(d.settings));location.reload();}catch(err){alert('Fehler: '+err.message)}};r.readAsText(f);e.target.value='';}
function exportCSV(){const T=ld();const esc=c=>{let s=String(c==null?'':c);if(/^[=+\-@\t]/.test(s)&&!/^-?\d/.test(s))s="'"+s;if(/[",\n\r]/.test(s))s='"'+s.replace(/"/g,'""')+'"';return s;};const h=['Datum','UL','Strat','K','Prämie/K','Total','Expiry','DTE','UL-Preis','Währung','Delta','IV','IVR','MaxRisk','%Kto','Status','Close','P&L','RoR%','EntryComm','CloseComm','TotalComm','Einstiegsnotiz','Schlussnotiz','Tags'];const rows=T.map(t=>{const r=calcRisk(t),rp=tradeRiskPct(t),ror=returnOnRisk(t);return[t.entryDate,t.underlying,t.strategy,t.contracts,t.premium,(t.premium*t.contracts*MUL).toFixed(0),t.expiry,Math.ceil((new Date(t.expiry)-new Date(t.entryDate))/864e5),t.underlyingPrice||'',t.currency||'USD',t.delta||'',t.iv||'',t.ivRank||'',r?Math.round(r):'',rp?rp.toFixed(1):'',t.status,t.closeDate||'',t.pnl||'',ror?ror.toFixed(1):'',t.commission||0,t.closeCommission||0,((t.commission||0)+(t.closeCommission||0)).toFixed(2),t.notes||'',t.closeNotes||'',(t.tags||[]).join(';')]});const csv=[h.map(esc).join(','),...rows.map(r=>r.map(esc).join(','))].join('\n');const b=new Blob(['\ufeff'+csv],{type:'text/csv'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`trades-${today()}.csv`;a.click();URL.revokeObjectURL(u);toast('CSV exportiert');}
